<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">NOT NULL 不能一律加魔法默认值</title>
  <desc id="desc">规范要求所有列 NOT NULL 并给默认值。必填应约束；可选未知应允许 NULL，勿用空串或 0 伪造。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / NULL</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">未知不要伪装成已知</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">一律填满</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">每列 NOT NULL</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">再塞 '' / 0 / 纪元日</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">统计与关联被污染</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">按语义</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">必填：NOT NULL</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">可选未知：允许 NULL</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">默认值=明确业务默认</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">NULL 比较要用 IS NULL；这不是消灭 NULL 的借口。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 mysql-null-comparison</text>
  </g>
</svg>
