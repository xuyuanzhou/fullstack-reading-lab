<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">一次部署里的本地事务</title>
  <desc id="desc">两个模块在同一进程，两张表在同一个库。</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">一次部署里的本地事务</text>
  
  <rect x="32" y="64" width="560" height="200" rx="16" fill="none" stroke="#3f6a58" stroke-dasharray="7 5"/>
  <text x="48" y="88" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">一次部署</text>
  <rect x="56" y="108" width="200" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="72" y="136" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单模块</text>
  <line x1="256" y1="140" x2="300" y2="140" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="306" y="108" width="200" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="322" y="136" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">库存模块</text>
  <text x="200" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">进程内方法调用</text>
  <rect x="120" y="220" width="280" height="28" rx="12" fill="#fafaf8" stroke="#d9ddd8"/><text x="136" y="248" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">同一个库：订单表 + 库存表</text>
  <rect x="640" y="120" width="280" height="80" rx="12" fill="#f6ecea" stroke="#a05048"/><text x="656" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">支付页在框外</text><text x="656" y="170" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">事务已经结束</text>

</svg>
