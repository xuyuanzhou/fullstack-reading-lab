<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">OR 不必一律改成 IN</title>
  <desc id="desc">同列多值 OR 与 IN 计划常相近；跨列 OR 才更需 EXPLAIN。不要背旧版口诀。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / OR</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">旧口诀不能代替现行计划</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">规范写法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">禁止 OR，必须改 IN</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">旧版 OR 不能走索引</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">跨列语义被误伤</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开看</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">同列：IN 可读，计划常近</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">跨列：EXPLAIN / UNION</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">以 8.x 计划为准</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">关键字禁令要拆开对象：OR、JOIN、小数存货币各不同。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">金额用 DECIMAL，见浮点精度课</text>
  </g>
</svg>
