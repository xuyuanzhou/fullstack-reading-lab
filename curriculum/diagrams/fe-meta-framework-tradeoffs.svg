<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">查看网页源代码</title>
  <desc id="desc">空 div 适合后台。文章标题要已经写在 HTML 里。</desc>
  <rect width="960" height="220" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">查看网页源代码时，标题在不在</text>
  <rect x="32" y="64" width="430" height="100" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
  <text x="48" y="100" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2e3330">登录后的表格</text>
  <text x="48" y="136" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">&lt;div id="app"&gt;&lt;/div&gt;</text>
  <rect x="490" y="64" width="438" height="100" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="506" y="100" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41">帮助文章</text>
  <text x="506" y="136" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">&lt;h1&gt;如何退款&lt;/h1&gt;</text>
  <text x="32" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41">Next 配 React，Nuxt 配 Vue，SvelteKit 配 Svelte。只留一个脚手架。</text>
</svg>
