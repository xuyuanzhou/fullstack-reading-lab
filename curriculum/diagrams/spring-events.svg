<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">默认同步：publishEvent 会等监听器</title>
  <desc id="desc">监听器自己登记。不加 @Async 时，发布方要等它跑完。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Spring</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">默认同步：publishEvent 会等监听器</text>
  <rect x="32" y="88" width="896" height="72" rx="14" fill="#2e3330" stroke="#2e3330" filter="url(#soft)"/><text x="480" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#fafaf8" text-anchor="middle">placeOrder → publishEvent → 返回订单号</text><rect x="32" y="180" width="430" height="120" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">没有 @Async</text><text x="48" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">监听器跑完，这一行才返回</text><rect x="498" y="180" width="430" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="514" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">加上 @Async</text><text x="514" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">改到别的线程，发布方不再等</text><rect x="32" y="324" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="352" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">增加审计时不要再给订单方法加一个注入。</text>
</svg>
