<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">UML 部署图：下单</title>
  <desc id="desc">立体框是节点，里面的矩形是制品。节点之间的线是通信路径，写上协议。</desc>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 部署图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">节点是跑进程的地方，制品是放进去的那一份</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <path d="M48 108 h200 l16 -16 h-200 z" fill="#dfe8e3" stroke="#3f6a58"/>
    <path d="M248 92 v120 l16 -16 v-120 z" fill="#e6efe9" stroke="#3f6a58"/>
    <rect x="48" y="108" width="200" height="120" fill="#fafaf8" stroke="#3f6a58"/>
    <text x="148" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">浏览器</text>
    <rect x="72" y="152" width="152" height="48" rx="8" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="148" y="181" text-anchor="middle" font-size="13" fill="#2e3330">订单页面</text>
    <line x1="264" y1="168" x2="332" y2="168" stroke="#3f6a58" stroke-width="1.6"/>
    <text x="268" y="158" font-size="12" fill="#3f6a58">HTTPS</text>
    <path d="M332 108 h250 l16 -16 h-250 z" fill="#dfe8e3" stroke="#3f6a58"/>
    <path d="M582 92 v160 l16 -16 v-160 z" fill="#e6efe9" stroke="#3f6a58"/>
    <rect x="332" y="108" width="250" height="160" fill="#fafaf8" stroke="#3f6a58"/>
    <text x="457" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">应用主机 · 两份副本</text>
    <rect x="352" y="156" width="96" height="80" rx="8" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="400" y="192" text-anchor="middle" font-size="13" fill="#2e3330">订单服务</text>
    <text x="400" y="212" text-anchor="middle" font-size="12" fill="#5e6661">jar</text>
    <rect x="466" y="156" width="96" height="80" rx="8" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="514" y="192" text-anchor="middle" font-size="13" fill="#2e3330">订单服务</text>
    <text x="514" y="212" text-anchor="middle" font-size="12" fill="#5e6661">jar</text>
    <line x1="457" y1="268" x2="220" y2="320" stroke="#4a6280" stroke-width="1.6"/>
    <text x="250" y="286" font-size="12" fill="#4a6280">JDBC</text>
    <line x1="514" y1="268" x2="740" y2="320" stroke="#4a6280" stroke-width="1.6"/>
    <text x="620" y="286" font-size="12" fill="#4a6280">消息</text>
    <path d="M80 336 h200 l16 -16 h-200 z" fill="#d5dde8" stroke="#4a6280"/>
    <path d="M280 320 v72 l16 -16 v-72 z" fill="#eef2f8" stroke="#4a6280"/>
    <rect x="80" y="336" width="200" height="64" fill="#fafaf8" stroke="#4a6280"/>
    <text x="180" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">数据库主机</text>
    <text x="180" y="384" text-anchor="middle" font-size="12" fill="#5e6661">MySQL 数据文件</text>
    <path d="M640 336 h220 l16 -16 h-220 z" fill="#d5dde8" stroke="#4a6280"/>
    <path d="M860 320 v72 l16 -16 v-72 z" fill="#eef2f8" stroke="#4a6280"/>
    <rect x="640" y="336" width="220" height="64" fill="#fafaf8" stroke="#4a6280"/>
    <text x="750" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">消息主机</text>
    <text x="750" y="384" text-anchor="middle" font-size="12" fill="#5e6661">已创建订单的消息</text>
