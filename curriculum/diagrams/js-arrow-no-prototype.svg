<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">箭头函数没有 prototype</title>
  <desc id="desc">只有能 new 的函数和 class 才有 prototype。箭头函数和 bind 的结果没有。Function.prototype 自己是函数。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JAVASCRIPT</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">能 new 才有 prototype</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="290" height="180" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="16" font-weight="600" fill="#2e3330">function / class</text>
    <text x="52" y="168" font-size="14" fill="#3f6a58">有 .prototype</text>
    <text x="52" y="196" font-size="14" fill="#5e6661">实例的内部原型指向它</text>
    <text x="52" y="224" font-size="14" fill="#3f6a58">可以 new</text>
    <rect x="340" y="96" width="290" height="180" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="360" y="132" font-size="16" font-weight="600" fill="#6e3530">箭头函数</text>
    <text x="360" y="168" font-size="14" fill="#6e3530">prototype 是 undefined</text>
    <text x="360" y="196" font-size="14" fill="#6e3530">new 会抛 TypeError</text>
    <text x="360" y="224" font-size="14" fill="#5e6661">bind 的结果同样没有</text>
    <rect x="648" y="96" width="280" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="668" y="132" font-size="16" font-weight="600" fill="#2e3330">Function.prototype</text>
    <text x="668" y="168" font-size="14" fill="#5e6661">typeof 是 function</text>
    <text x="668" y="196" font-size="14" fill="#5e6661">不是普通对象实例</text>
    <text x="668" y="224" font-size="14" fill="#3f6a58">它的原型才是 Object.prototype</text>
  </g>
  <text x="32" y="330" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">不要写成「只要是函数就有 prototype，原型对象都是 Object 构造出来的」。</text>
  <text x="32" y="358" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">class 仍是函数，方法在 prototype 上；这和箭头函数根本没有 prototype 不是同一条限制。</text>
</svg>