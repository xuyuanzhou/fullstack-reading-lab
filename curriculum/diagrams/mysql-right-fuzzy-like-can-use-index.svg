<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">右模糊常可索引</title>
  <desc id="desc">资料前后页要一起读。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / LIKE</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">前缀匹配与前导 % 要分开背</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">误背</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">模糊都不能索引</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略资料自洽区分</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">短前缀不看选择性</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">prefix% 可范围</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">%suffix 难最左</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">仍看 rows</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">资料前后页要一起读。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照前导 % 课</text>
  </g>
</svg>
