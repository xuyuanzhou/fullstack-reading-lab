<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Young、Mixed、Full 扫的范围不一样</title>
  <desc id="desc">Full GC 收整个 Java 堆。G1 的 Mixed 只带上一部分老年代分区。JDK 8 起没有永久代。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Young、Mixed、Full 扫的范围不一样</text>
  <rect x="32" y="88" width="288" height="210" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="start">Young</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">只收年轻代</text><text x="48" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">Eden 和 Survivor</text><text x="48" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">老年代不动</text><rect x="336" y="88" width="288" height="210" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="352" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2d4f41" text-anchor="start">Mixed</text><text x="352" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">年轻代</text><text x="352" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">加上一部分老分区</text><text x="352" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">不是整堆</text><text x="352" y="244" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">不要记成 Full</text><rect x="640" y="88" width="288" height="210" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="656" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#6e3530" text-anchor="start">Full</text><text x="656" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">年轻代 + 老年代</text><text x="656" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">整堆回收</text><text x="656" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">日志里才叫 Full</text><text x="656" y="244" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">没有 PermGen</text><rect x="32" y="318" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="346" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">Metaspace 在堆外。元空间溢出是另一句 OutOfMemoryError，不是 Full 没扫到永久代。</text>
</svg>
