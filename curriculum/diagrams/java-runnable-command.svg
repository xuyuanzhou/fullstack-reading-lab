<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">池子只接收工作对象</title>
  <desc id="desc">Executor.execute 不包含订单步骤。订单号跟 Runnable 走。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="380" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Java</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">池子只接收工作对象</text>
  <rect x="32" y="88" width="300" height="168" rx="14" fill="#2e3330" stroke="#2e3330" filter="url(#soft)"/><text x="182" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#fafaf8" text-anchor="middle">execute</text><text x="182" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#c5ddd0" text-anchor="middle">池的类没有 ship</text><rect x="370" y="88" width="270" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="505" y="155" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2d4f41" text-anchor="middle">ship(orderId)</text><text x="505" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#3f6a58" text-anchor="middle">工作对象</text><rect x="670" y="88" width="258" height="168" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="799" y="155" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="middle">mail(orderId)</text><text x="799" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="middle">仍是 execute</text><rect x="32" y="280" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="308" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">换一种任务时，线程池的类不应出现 diff。</text>
</svg>
