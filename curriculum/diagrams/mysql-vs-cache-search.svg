<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">DB, cache, and search have different jobs</title>
  <desc id="desc">MySQL ledger, Redis hot reads, Elasticsearch retrieval projection.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">MySQL / vs cache and search</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Ledger, hot cache, and search projection</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="280" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">MySQL</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">authoritative writes</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">transactions</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">keyed / indexed OLTP</text>
    <rect x="340" y="96" width="280" height="176" rx="14" fill="#eef2f8" stroke="#4a6280"/>
    <text x="360" y="132" font-size="15" font-weight="600" fill="#2e3330">Redis</text>
    <text x="360" y="164" font-size="14" fill="#3f6a58">hot read acceleration</text>
    <text x="360" y="196" font-size="14" fill="#3f6a58">structure ops</text>
    <text x="360" y="228" font-size="14" fill="#5e6661">not the ledger</text>
    <rect x="648" y="96" width="280" height="176" rx="14" fill="#f3efe8" stroke="#8a7040"/>
    <text x="668" y="132" font-size="15" font-weight="600" fill="#2e3330">Elasticsearch</text>
    <text x="668" y="164" font-size="14" fill="#3f6a58">relevance search</text>
    <text x="668" y="196" font-size="14" fill="#3f6a58">facets / aggs</text>
    <text x="668" y="228" font-size="14" fill="#5e6661">rebuildable projection</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">More indexes are not a search engine or a cache. Keep jobs separate.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See redis-vs-db-cache and es-vs-db-search</text>
  </g>
</svg>
