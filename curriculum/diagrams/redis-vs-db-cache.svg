<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">数据库是权威；Redis 缓存可短暂不一致</title>
  <desc id="desc">旁路缓存允许数据库与 Redis 之间出现短暂不一致。钱货账本在数据库，可重建的热点投影可进 Redis。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Redis / 对照数据库</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">数据库是权威；缓存可短暂不一致</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">数据库</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">事务与账本</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">权威状态</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">写入以库为准</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#eef2f8" stroke="#4a6280"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">Redis 缓存</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">热点读、更低延迟</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">旁路：写后删键（Cache Aside）</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">允许短暂旧值</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">钱货账本在数据库；可重建的热点投影可进 Redis。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 cache-aside-steps 与 cache-db-double-write-race</text>
  </g>
</svg>
