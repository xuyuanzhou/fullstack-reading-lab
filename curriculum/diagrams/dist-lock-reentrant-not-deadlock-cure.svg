<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">可重入不是分布式死锁的解药</title>
  <desc id="desc">可重入只避免同一持有者在同一锁上自堵；交叉死锁、忘释放仍要顺序、超时与租约。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">DIST LOCK / REENTRANT</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">“可重入 = 避免死锁”范围过大</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">括注误导</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">要可重入（避免死锁）</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">像开了重入就万事大吉</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">交叉双锁仍会卡死</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">各自管什么</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">可重入：同持有者同锁自堵</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">交叉死锁：顺序 / 超时</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">忘释放：租约 + 持有者校验</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">需求列表里可重入是可选语义，不能代替互斥与租约。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 java-reentrant-lock、distributed-lock</text>
  </g>
</svg>
