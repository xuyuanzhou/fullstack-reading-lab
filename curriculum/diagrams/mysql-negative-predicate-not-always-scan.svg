<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">负向谓词不是扫表定律</title>
  <desc id="desc">运算符字形不能代替访问路径。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 谓词</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">负向常慢，但是否扫表看计划</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">规范绝对化</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">NOT/!=/NOT IN 一律扫表</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略选择性</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略版本</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">证据</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">看 EXPLAIN rows</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">低基数列才危险</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">NULL 语义另审</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">运算符字形不能代替访问路径。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">用计划决策</text>
  </g>
</svg>
