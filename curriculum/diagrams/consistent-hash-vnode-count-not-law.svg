<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">vnode count 32 is not a uniformity law</title>
  <desc id="desc">Virtual nodes ease arc skew; fixed 32 is a starting heuristic, not a hot-key cure.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">consistent hashing</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">No magic integer for vnode count</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">common claim</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">usually set to 32 or more</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">few nodes become uniform</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">sounds like a fixed recipe</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">reality check</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">tune by variance / move cost</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">too many vnodes cost metadata</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">hot keys need isolation</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Memorizing 32 neither fixes hot keys nor replaces measurement.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See hash-skew and consistent-hash lessons</text>
  </g>
</svg>
