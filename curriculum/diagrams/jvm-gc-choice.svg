<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">先对齐暂停和接口耗时，再谈换回收器</title>
  <desc id="desc">G1 是服务器上的通用默认。ZGC 把停顿压短，同时多占内存。暂停对不上延迟时，换回收器没有帮助。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">先对齐暂停和接口耗时，再谈换回收器</text>
  <rect x="32" y="88" width="440" height="196" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5e6661" text-anchor="start">对不上</text><text x="48" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">接口慢请求 40 ms</text><text x="48" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">回收暂停 5 ms</text><text x="48" y="230" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="start">先查 SQL、锁或网络</text><text x="48" y="256" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">换回收器盖不住这一段</text><rect x="488" y="88" width="440" height="196" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="504" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#3f6a58" text-anchor="start">对得上</text><text x="504" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">暂停经常到 500 ms</text><text x="504" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">并且和超时同时出现</text><text x="504" y="230" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="start">再评估 G1 的停顿目标</text><text x="504" y="256" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">或接受 ZGC 的内存开销</text><rect x="32" y="308" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="336" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">JDK 9 起服务器默认是 G1。ZGC 用来缩短停顿，不是把 CPU 变少。</text>
</svg>
