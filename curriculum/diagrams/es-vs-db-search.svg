<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">DB LIKE is not a search engine</title>
  <desc id="desc">DB keeps authority; ES is a rebuildable search projection.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Elasticsearch / vs DB</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">LIKE can match; search needs ranking and analysis</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">Database</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">transactions / keys</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">authoritative state</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">LIKE is not relevance search</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">Elasticsearch</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">analysis + relevance</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">filters + aggregations</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">rebuildable projection</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Write orders to the DB; sync searchable fields to ES.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See elastic-analysis and es-aggregations</text>
  </g>
</svg>
