<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">不要用本机墙钟做 Redis 锁过期</title>
  <desc id="desc">资料用 setnx/get/getset 把过期时间写成客户端当前时间。机器时钟一偏，锁会提前失效或永不超时。应用 SET key token NX EX，过期由 Redis 服务端计时。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">REDIS LOCK</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">过期比的是谁的表，不是哪台机器的时钟</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料写法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">value = 本机当前时间 + 超时</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">get / getset 再和本机时间比</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">时钟一偏，锁语义就歪</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">现行写法</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">SET key token NX EX seconds</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">TTL 由 Redis 服务端倒数</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">释放时比对 token 再删</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">SETNX+EXPIRE 两段仍有崩溃窗口，见 redis-lock-setnx-expire-race。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">租约不是永久所有权，见 distributed-lock</text>
  </g>
</svg>
