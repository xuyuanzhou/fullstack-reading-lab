<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">事务选型：先问还在不在一个库</title>
  <desc id="desc">还在一个库就用本地事务。出了库分成本地消息表、Saga 和 TCC。用户支付不进 TCC 的框。</desc>
    <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6a58"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6661"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#f6f7f4"/>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <text x="32" y="36" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">画图 / 事务选型</text>
    <text x="32" y="64" font-size="20" font-weight="600" fill="#2e3330">先问还在不在一个库，三条不并成一种</text>

    <rect x="48" y="96" width="280" height="64" rx="12" fill="#fafaf8" stroke="#2e3330"/>
    <text x="68" y="134" font-size="15" font-weight="600" fill="#2e3330">不变量还在一个库？</text>
    <line x1="188" y1="160" x2="188" y2="196" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="200" y="184" font-size="13" fill="#3f6a58">是</text>
    <rect x="48" y="204" width="280" height="72" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="68" y="236" font-size="15" font-weight="600" fill="#2e3330">本地事务</text>
    <text x="68" y="258" font-size="13" fill="#5e6661">停在这里，不画协调器</text>

    <line x1="328" y1="128" x2="400" y2="128" stroke="#5e6661" stroke-width="1.6" marker-end="url(#arrGray)"/>
    <text x="340" y="116" font-size="13" fill="#5e6661">否</text>

    <rect x="408" y="96" width="500" height="280" rx="16" fill="none" stroke="#d9ddd8"/>
    <text x="428" y="124" font-size="13" fill="#5e6661">已经分库</text>

    <rect x="428" y="144" width="220" height="88" rx="12" fill="#eef2f8" stroke="#4a6280"/>
    <text x="444" y="176" font-size="15" font-weight="600" fill="#2e3330">本地消息表</text>
    <text x="444" y="200" font-size="13" fill="#5e6661">支付库一次提交</text>
    <text x="444" y="220" font-size="13" fill="#5e6661">订单库另一次</text>

    <rect x="668" y="144" width="220" height="88" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="684" y="176" font-size="15" font-weight="600" fill="#2e3330">Saga</text>
    <text x="684" y="200" font-size="13" fill="#5e6661">释放是新写入</text>
    <text x="684" y="220" font-size="13" fill="#5e6661">支付等待在这一侧</text>

    <rect x="428" y="252" width="460" height="100" rx="12" fill="#fafaf8" stroke="#a05048" stroke-dasharray="6 4"/>
    <text x="444" y="284" font-size="15" font-weight="600" fill="#2e3330">TCC · 只框短预留</text>
    <text x="444" y="308" font-size="13" fill="#5e6661">Try / Confirm / Cancel</text>
    <text x="444" y="330" font-size="13" fill="#6e3530">空回滚写在取消支</text>

    <rect x="668" y="400" width="240" height="64" rx="12" fill="#f6ecea" stroke="#a05048"/>
    <text x="684" y="428" font-size="15" font-weight="600" fill="#6e3530">用户支付</text>
    <text x="684" y="450" font-size="13" fill="#6e3530">在 TCC 框外</text>

    <text x="48" y="500" font-size="14" fill="#2e3330">三个名字不写进同一个框。</text>
  </g>
</svg>
