<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">可重入身份用随机令牌，不要拼 MAC</title>
  <desc id="desc">资料用 MAC+PID+TID 标识持有者。容器与 PID 回收会撞车；应写入随机 token 并比对。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">DIST LOCK / OWNER</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">持有者是令牌，不是网卡串</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料拼法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">MAC + JVM PID + TID</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">相同串就当重入</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">虚拟网卡 / PID 回收会撞车</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">稳妥做法</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">占锁写入随机 token</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">重入 / 释放都比对 token</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">TTL / 会话由锁服务端管</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">重入计数可以要；身份不要绑硬件与 OS 可回收编号。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 distributed-lock、redis-lock-setnx-expire-race</text>
  </g>
</svg>
