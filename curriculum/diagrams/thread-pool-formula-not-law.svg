<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">线程池公式只是起点</title>
  <desc id="desc">核数倍数要对照任务类型、队列与拒绝策略。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">线程池</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">CPU×2 是启发式，不是容量定律</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">口诀</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">线程数 = 核数 × 2</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">写进配置就上线</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">不再看队列与拒绝</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">还要问</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">CPU 密还是阻塞 IO</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">队列有界与拒绝策略</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">下游超时与连接池</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">用压测和池指标调，不背核数倍数。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照虚拟线程与无界队列课</text>
  </g>
</svg>
