<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">UML 用例图：下单</title>
  <desc id="desc">校验库存由提交订单 include，箭头指向校验库存。使用优惠券 extend 提交订单，箭头指向提交订单。</desc>
  <rect width="960" height="540" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 用例图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">必做指向被包含的用例，可选指向基本用例</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="160" y="96" width="640" height="360" rx="16" fill="#f6f7f4" stroke="#3f6a58" stroke-width="1.6"/>
    <text x="180" y="124" font-size="13" font-weight="600" fill="#3f6a58">订单系统</text>

    <line x1="108" y1="188" x2="420" y2="176" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="96" y1="248" x2="182" y2="392" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="786" y1="330" x2="820" y2="300" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="520" y1="214" x2="520" y2="268" stroke="#3f6a58" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#openGreen)"/>
    <text x="532" y="248" font-size="13" fill="#3f6a58">«include»</text>
    <line x1="392" y1="228" x2="432" y2="196" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#openBlue)"/>
    <text x="176" y="208" font-size="13" fill="#4a6280">«extend» · 带了券码</text>

    <ellipse cx="520" cy="176" rx="92" ry="38" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="520" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">提交订单</text>
    <ellipse cx="520" cy="310" rx="92" ry="34" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="520" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">校验库存</text>
    <ellipse cx="292" cy="250" rx="100" ry="34" fill="#eef2f8" stroke="#4a6280"/>
    <text x="292" y="256" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">使用优惠券</text>
    <ellipse cx="708" cy="330" rx="78" ry="34" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="708" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">支付</text>
    <ellipse cx="300" cy="400" rx="118" ry="34" fill="#fafaf8" stroke="#2e3330"/>
    <text x="300" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">取消未支付订单</text>

    <circle cx="78" cy="156" r="16" fill="#f6f7f4" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="78" y1="172" x2="78" y2="214" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="54" y1="190" x2="102" y2="190" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="78" y1="214" x2="58" y2="248" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="78" y1="214" x2="98" y2="248" stroke="#2e3330" stroke-width="1.6"/>
    <text x="78" y="272" text-anchor="middle" font-size="13" fill="#2e3330">下单用户</text>

    <rect x="820" y="268" width="112" height="64" rx="8" fill="#fafaf8" stroke="#2e3330"/>
    <text x="876" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">支付渠道</text>
    <text x="876" y="314" text-anchor="middle" font-size="12" fill="#5e6661">参与者</text>

    <rect x="32" y="472" width="896" height="52" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="494" font-size="14" fill="#2e3330">include：每次都执行，箭头指向校验库存。</text>
    <text x="52" y="514" font-size="14" fill="#2e3330">extend：可以不做，箭头指向提交订单。支付渠道画在边界外。</text>
  </g>
  <defs>
    <marker id="openGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3f6a58" stroke-width="1.4"/>
    </marker>
    <marker id="openBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a6280" stroke-width="1.4"/>
    </marker>
  </defs>
</svg>
