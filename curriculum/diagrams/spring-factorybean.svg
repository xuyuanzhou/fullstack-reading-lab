<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">同名取出的是产品，不是工厂</title>
  <desc id="desc">FactoryBean 的 getBean(名字) 得到 getObject 的结果。工厂自己要加 &amp;。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Spring</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">同名取出的是产品，不是工厂</text>
  <rect x="32" y="88" width="896" height="72" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="480" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="middle">名为 client 的 FactoryBean</text><rect x="32" y="180" width="430" height="110" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">getBean(&quot;client&quot;)</text><text x="48" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">类型是 Client</text><rect x="498" y="180" width="430" height="110" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="514" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">getBean(&quot;&amp;client&quot;)</text><text x="514" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">类型是 FactoryBean</text><rect x="32" y="316" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="344" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">业务构造器声明 Client。不要把工厂类型注进业务代码。</text>
</svg>
