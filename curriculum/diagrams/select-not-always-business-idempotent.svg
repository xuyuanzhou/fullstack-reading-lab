<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">SELECT 幂等有边界</title>
  <desc id="desc">幂等是业务性质，不是语句字形。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">消息 / 幂等</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">SQL 稳定≠业务读无副作用</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">select 天然幂等</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略读侧计量</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">跳过写键</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">边界</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">纯查询可重试</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">有副作用要键</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">写路径必设计</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">幂等是业务性质，不是语句字形。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照删除幂等课</text>
  </g>
</svg>
