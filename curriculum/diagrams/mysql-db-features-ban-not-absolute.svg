<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">库内特性要拆开禁</title>
  <desc id="desc">禁止藏逻辑，不是禁止一切数据库对象。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 对象</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">算力上移是默认，不是四种非法</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">一刀切</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">过程视图触发器 Event 全禁</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略只读视图</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略调度需求</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">拆开</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">默认上移</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">视图可只读例外</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">触发器慎藏副作用</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">禁止藏逻辑，不是禁止一切数据库对象。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">例外要有主人</text>
  </g>
</svg>
