<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">子查询不是罪名</title>
  <desc id="desc">优化器比口诀新。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 子查询</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">危险在物化形态，不是关键字</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">禁令</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">大表禁止子查询</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">逼出 N+1</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略半连接</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">证据</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">EXPLAIN ANALYZE</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">改写 JOIN/EXISTS</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">看物化</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">优化器比口诀新。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照 JOIN 禁令课</text>
  </g>
</svg>
