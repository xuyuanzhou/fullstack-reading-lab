<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">七个先写变化点</title>
  <desc id="desc">认得名字不等于现在就加一层类。指不出那一块时不要凑数。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">其余</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">七个先写变化点</text>
  <rect x="32" y="88" width="430" height="188" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">标准库已经对上</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">命令 → Runnable</text><text x="48" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">迭代器 → Iterator</text><text x="48" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">先打开 Java 标准库那一组</text><rect x="498" y="88" width="430" height="188" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="514" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">还没有单独深入课</text><text x="514" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">原型  中介者  备忘录</text><text x="514" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">访问者  解释器</text><text x="514" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">先写变化点，再决定立课</text><rect x="32" y="300" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="328" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">只当场调一个方法、不要排队也不要撤销，不要先做 Command。</text>
</svg>
