<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Messaging capacity needs lag and load tests</title>
  <desc id="desc">No universal TPS; size by parallelism, message size, consumer time.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Messaging / capacity</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Tradeoffs and sizing, no universal TPS slogan</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="280" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">Pros</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">peak shave</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">multi-subscribe</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">independent scale</text>
    <rect x="340" y="96" width="280" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="360" y="132" font-size="15" font-weight="600" fill="#6e3530">Costs</text>
    <text x="360" y="164" font-size="14" fill="#2e3330">at-least-once</text>
    <text x="360" y="196" font-size="14" fill="#2e3330">backlog / disk</text>
    <text x="360" y="228" font-size="14" fill="#5e6661">longer debug path</text>
    <rect x="648" y="96" width="280" height="176" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="668" y="132" font-size="15" font-weight="600" fill="#2e3330">Measure</text>
    <text x="668" y="164" font-size="14" fill="#3f6a58">partitions / queues</text>
    <text x="668" y="196" font-size="14" fill="#3f6a58">msg size + P99</text>
    <text x="668" y="228" font-size="14" fill="#5e6661">lag alerts + load test</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Capacity = parallelism + size + consumer time. Numbers go in a capacity sheet.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See mq-dlq-backlog and mq-backlog-expand-queues</text>
  </g>
</svg>
