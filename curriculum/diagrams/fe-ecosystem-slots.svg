<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Vue 新项目各留一个槽位</title>
  <desc id="desc">构建、路由、跨页状态不要各有两套。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="360" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">选型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Vue 新项目各留一个槽位</text>
  <rect x="32" y="88" width="288" height="150" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">构建</text><text x="48" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#2e3330" text-anchor="start">Vite</text><rect x="336" y="88" width="288" height="150" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="352" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">路由</text><text x="352" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#2e3330" text-anchor="start">Vue Router</text><rect x="640" y="88" width="288" height="150" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="656" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">跨页状态</text><text x="656" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="400" fill="#2e3330" text-anchor="start">Pinia</text><rect x="32" y="262" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="290" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">要首屏正文时用 Nuxt。Vuex 只留在已有仓库。</text>
</svg>
