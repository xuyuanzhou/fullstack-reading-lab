<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">年轻代仍是 Eden 加两块 Survivor，永久代已经没有</title>
  <desc id="desc">MaxPermSize 在 JDK 8 及以后会被忽略。类元数据用 MaxMetaspaceSize。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">年轻代仍是 Eden 加两块 Survivor，永久代已经没有</text>
  <text x="32" y="96" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5e6661" text-anchor="start">Java 堆</text><rect x="32" y="108" width="520" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="56" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">Eden</text><text x="200" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">Survivor</text><text x="380" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">Survivor</text><text x="56" y="176" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#3f6a58" text-anchor="start">只有这两块，不能再配出第三块</text><rect x="572" y="108" width="356" height="88" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="592" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">老年代</text><text x="592" y="176" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">晋升之后的对象</text><rect x="32" y="216" width="430" height="88" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#8a918c" text-anchor="start">永久代 / MaxPermSize</text><text x="48" y="278" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">参数被忽略，日志里不要再找它</text><rect x="486" y="216" width="442" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="502" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">Metaspace</text><text x="502" y="278" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">类元数据在堆外，用 MaxMetaspaceSize</text><rect x="32" y="328" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="356" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">Full GC 不再有“永久代被写满”这一条。类加载泄漏看元空间。</text>
</svg>
