<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">动作之后，当前状态换成下一个</title>
  <desc id="desc">对外方法只委托。按 status 字符串在每个方法里分支，新增状态就要改每一处。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">行为型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">动作之后，当前状态换成下一个</text>
  <rect x="32" y="88" width="280" height="200" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">未支付</text><text x="48" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">pay 允许</text><text x="48" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">完成后换成已支付</text><text x="48" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">订单类里没有 if</text><rect x="340" y="88" width="280" height="200" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="356" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">已支付</text><text x="356" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">再 pay 就拒绝</text><text x="356" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">状态不改</text><text x="356" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">副作用没有日志</text><rect x="648" y="88" width="280" height="200" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="664" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">字符串 status</text><text x="664" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">pay 里一套 if</text><text x="664" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">ship 里再一套</text><text x="664" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">漏一处就放行</text><rect x="32" y="316" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="344" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">新增一种状态应是新类。旧的 pay、ship 不应再加分支。</text>
</svg>
