<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">不是万物皆对象，链停在 null</title>
  <desc id="desc">数字是原始值。普通对象有原型。Object.create(null) 没有原型。null 的 typeof 虽是 object，但它不是空对象。</desc>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JAVASCRIPT</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">划掉「万物皆对象」</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14">
    <rect x="32" y="96" width="440" height="70" rx="12" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="126" font-weight="600" fill="#2e3330">1</text>
    <text x="120" y="126" fill="#5e6661">typeof number</text>
    <text x="320" y="126" fill="#6e3530">赋属性留不住</text>
    <rect x="32" y="176" width="440" height="70" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="206" font-weight="600" fill="#2e3330">{}</text>
    <text x="120" y="206" fill="#5e6661">typeof object</text>
    <text x="320" y="206" fill="#3f6a58">原型到 null</text>
    <rect x="32" y="256" width="440" height="70" rx="12" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="286" font-weight="600" fill="#2e3330">create(null)</text>
    <text x="200" y="286" fill="#5e6661">是对象</text>
    <text x="300" y="286" fill="#3f6a58">原型就是 null</text>
    <rect x="32" y="336" width="440" height="56" rx="12" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="370" font-weight="600" fill="#6e3530">null</text>
    <text x="120" y="370" fill="#6e3530">typeof 虽是 object，不是空对象</text>
    <rect x="500" y="96" width="428" height="296" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="524" y="136" font-size="15" font-weight="600" fill="#2e3330">查找停在哪里</text>
    <text x="524" y="176" fill="#5e6661">{} → Object.prototype → null</text>
    <text x="524" y="210" fill="#5e6661">create(null) → null</text>
    <text x="524" y="244" fill="#6e3530">getPrototypeOf(null) 抛 TypeError</text>
    <text x="524" y="290" fill="#5e6661">日常用 getPrototypeOf</text>
    <text x="524" y="324" fill="#6e3530">不要读 __proto__</text>
  </g>
</svg>