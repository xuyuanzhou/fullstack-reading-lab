<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">顺序写死，只换中间那一步</title>
  <desc id="desc">模板的准备和收尾不交给每个子类重写。顺序本身要变时，做成另一个策略。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">设计模式</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">顺序写死，只换中间那一步</text>
  <rect x="32" y="88" width="896" height="64" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="480" y="128" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="middle">准备  →  这一步可替换  →  收尾</text><rect x="32" y="172" width="430" height="100" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="210" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">导出报表</text><text x="48" y="240" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">子类只写正文，调用方只调 export</text><rect x="498" y="172" width="430" height="100" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="514" y="210" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">必须先收尾再准备</text><text x="514" y="240" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">这是另一个算法，不要重写骨架</text><rect x="32" y="300" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="328" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">替换方抛错时，收尾仍按骨架执行。不要让每个子类自己记得关闭。</text>
</svg>
