<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">UUID 不只有乱序字符串一种</title>
  <desc id="desc">聚簇主键仍慎用乱序键；有序 UUID 与二进制存储要分题。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">发号 / UUID</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">随机无序、字符串存储不是 UUID 定律</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料写法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">没有排序</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">往往字符串存储</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略版本差异</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开看</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">v4 近似随机</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">v7 可时间有序</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">可 BINARY 十六字节</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">聚簇主键仍慎用乱序键；有序 UUID 与二进制存储要分题。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照 mysql-uuid-not-clustered-pk</text>
  </g>
</svg>
