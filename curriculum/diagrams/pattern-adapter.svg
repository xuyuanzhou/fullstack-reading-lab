<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">把别人的方法收成你的接口</title>
  <desc id="desc">适配器两边的方法名可以不同。同一接口上加行为仍然是装饰器。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">设计模式</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">把别人的方法收成你的接口</text>
  <rect x="32" y="88" width="280" height="180" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5e6661" text-anchor="start">现成客户端</text><text x="48" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">payByXml</text><text x="48" y="204" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">不归这次需求改</text><rect x="340" y="88" width="280" height="180" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="356" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58" text-anchor="start">适配器</text><text x="356" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2d4f41" text-anchor="start">实现 Payment</text><text x="356" y="204" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">内部再调用 payByXml</text><rect x="648" y="88" width="280" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="664" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5e6661" text-anchor="start">结算</text><text x="664" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">charge</text><text x="664" y="204" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">看不到第三方方法名</text><rect x="32" y="292" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="320" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">重试不要写进适配器。它包在 charge 这个接口外面。</text>
</svg>
