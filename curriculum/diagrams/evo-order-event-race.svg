<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">先提交成功的箭头生效</title>
  <desc id="desc">签收和退货入库都从已发货出发。先成功的留下，后到的影响 0 行。签收之后用顾客退回。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a928c"/></marker>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="34" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">同一起点，先提交的那条生效</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">订单状态只由订单服务写。后到的更新影响 0 行</text>

  <rect x="36" y="88" width="160" height="52" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="80" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">已发货</text>

  <line x1="196" y1="104" x2="300" y2="88" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="214" y="84" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">签收 · 先成功</text>
  <rect x="300" y="64" width="160" height="52" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="344" y="96" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">已完成</text>

  <line x1="196" y1="128" x2="300" y2="168" stroke="#8a928c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <text x="214" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#5e6661">退货入库 · 影响 0 行</text>
  <rect x="300" y="156" width="160" height="52" rx="12" fill="#f3f1ea" stroke="#8a928c"/>
  <text x="344" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#5e6661">已退货</text>

  <line x1="380" y1="116" x2="380" y2="156" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="388" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">顾客退回</text>

  <rect x="560" y="80" width="360" height="150" rx="12" fill="#f6ecea" stroke="#a05048"/>
  <text x="576" y="108" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#6e3530">谁可以写订单状态</text>
  <text x="576" y="134" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">只有订单服务按迁移表更新</text>
  <text x="576" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">支付、履约、物流只提交自己的事实</text>
  <text x="576" y="178" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">消息到达后，由订单服务执行</text>
  <text x="576" y="206" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">WHERE 里的起点必须仍是已发货</text>

  <rect x="36" y="250" width="884" height="78" rx="12" fill="#eef3f6" stroke="#3d5c73"/>
  <text x="52" y="278" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330">锁定数量是另一份状态</text>
  <text x="52" y="302" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#2e3330">可售 → 已预留 → 已扣减。取消则已预留 → 已释放。已扣减和已释放不回到已预留。</text>
  <text x="52" y="322" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#2e3330">签收不改锁定数量。这条状态不写进订单的 status。</text>

  <text x="36" y="368" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">若退货入库先成功，签收同样影响 0 行，订单留在已退货。</text>
</svg>
