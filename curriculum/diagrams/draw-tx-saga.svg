<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Saga：补偿是新的写入</title>
  <desc id="desc">正向的订单和预留已经提交。支付失败之后，释放预留和取消订单是新的写入，不是回滚。</desc>
  <rect width="960" height="540" rx="18" fill="#f6f7f4"/>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <text x="32" y="36" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SAGA</text>
    <text x="32" y="64" font-size="20" font-weight="600" fill="#2e3330">已经提交的步骤，用新写入纠正</text>

    <text x="48" y="108" font-size="13" fill="#5e6661">正向 · 都已提交</text>
    <rect x="48" y="124" width="200" height="72" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="148" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">插入待支付</text>
    <text x="148" y="178" text-anchor="middle" font-size="12" fill="#3f6a58">已提交</text>
    <line x1="248" y1="160" x2="312" y2="160" stroke="#2e3330" stroke-width="1.6" marker-end="url(#sg)"/>
    <rect x="312" y="124" width="200" height="72" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="412" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">预留库存</text>
    <text x="412" y="178" text-anchor="middle" font-size="12" fill="#3f6a58">已提交</text>
    <line x1="512" y1="160" x2="576" y2="160" stroke="#2e3330" stroke-width="1.6" marker-end="url(#sg)"/>
    <rect x="576" y="124" width="200" height="72" rx="12" fill="#f6ecea" stroke="#a05048"/>
    <text x="676" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#6e3530">支付失败</text>

    <path d="M620 196 V250 H480 V300" fill="none" stroke="#4a6280" stroke-width="1.6" marker-end="url(#sgBlue)"/>
    <text x="500" y="242" font-size="13" fill="#4a6280">不是回滚</text>
    <line x1="732" y1="196" x2="732" y2="300" stroke="#4a6280" stroke-width="1.6" marker-end="url(#sgBlue)"/>

    <text x="48" y="292" font-size="13" fill="#5e6661">反向 · 新的写入</text>
    <rect x="360" y="300" width="240" height="72" rx="12" fill="#eef2f8" stroke="#4a6280"/>
    <text x="480" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">释放预留</text>
    <text x="480" y="354" text-anchor="middle" font-size="12" fill="#4a6280">新写入 · 按订单号一次</text>
    <rect x="640" y="300" width="240" height="72" rx="12" fill="#eef2f8" stroke="#4a6280"/>
    <text x="760" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单改成已取消</text>
    <text x="760" y="354" text-anchor="middle" font-size="12" fill="#4a6280">新写入</text>

    <rect x="32" y="412" width="896" height="96" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="448" font-size="14" fill="#2e3330">上排两步都标着已提交。下排不写 rollback，也不写 undo。</text>
    <text x="52" y="476" font-size="14" fill="#6e3530">支付等待停在上排末端，不画进还开着的全局事务。</text>
  </g>
  <defs>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e3330"/>
    </marker>
    <marker id="sgBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6280"/>
    </marker>
  </defs>
</svg>
