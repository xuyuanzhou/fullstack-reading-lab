<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">套一层，类型仍然是同一个接口</title>
  <desc id="desc">装饰器把行为叠在同一接口上。调用方不用改成一个新的子类。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">模式</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">套一层，类型仍然是同一个接口</text>
  <rect x="32" y="88" width="896" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">变量类型 DataSource</text><rect x="48" y="148" width="250" height="88" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="173" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="middle">连接</text><text x="173" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="middle">原来的实现</text><rect x="330" y="148" width="250" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="455" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="middle">计时</text><text x="455" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#3f6a58" text-anchor="middle">仍是 DataSource</text><rect x="612" y="148" width="280" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="752" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="middle">重试</text><text x="752" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#3f6a58" text-anchor="middle">调用方类型不变</text><rect x="32" y="292" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="320" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">只想要计时时，去掉重试那一层。不要再写一个带两种能力的子类。</text>
</svg>
