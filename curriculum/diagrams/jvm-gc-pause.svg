<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">回收次数和用户感觉到的停顿不是一回事</title>
  <desc id="desc">短命对象可以回收很多次，每次只有几毫秒。一次很长的全堆暂停会直接出现在尾延迟里。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">回收次数和用户感觉到的停顿不是一回事</text>
  <rect x="32" y="88" width="440" height="188" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">次数很多，每次很短</text><g fill="#3f6a58"><rect x="56" y="168" width="16" height="36" rx="4"/><rect x="104" y="168" width="16" height="36" rx="4"/><rect x="152" y="168" width="16" height="36" rx="4"/><rect x="200" y="168" width="16" height="36" rx="4"/><rect x="248" y="168" width="16" height="36" rx="4"/><rect x="296" y="168" width="16" height="36" rx="4"/><rect x="344" y="168" width="16" height="36" rx="4"/><rect x="392" y="168" width="16" height="36" rx="4"/></g><text x="48" y="236" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">年轻代收集上升，P99 可以不动</text><rect x="488" y="88" width="440" height="188" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="504" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">次数少，一次很长</text><rect x="520" y="156" width="280" height="48" rx="8" fill="#a05048"/><text x="504" y="236" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">这一段和延迟尖峰落在同一时刻</text><rect x="32" y="300" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="328" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">把暂停时间和延迟直方图对齐。对不上，不要先换收集器。</text>
</svg>
