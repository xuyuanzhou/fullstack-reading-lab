<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">单体图：一个进程一次提交</title>
  <desc id="desc">虚线框是一次部署。订单模块和库存模块在框内互相调用。一个数据库一次提交。支付页在框外。</desc>
  <rect width="960" height="500" rx="18" fill="#f6f7f4"/>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <text x="32" y="36" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">画图 / 单体</text>
    <text x="32" y="64" font-size="20" font-weight="600" fill="#2e3330">一个进程，一次提交，支付在框外</text>
    <rect x="40" y="100" width="120" height="48" rx="12" fill="#fafaf8" stroke="#2e3330"/>
    <text x="68" y="130" font-size="15" fill="#2e3330">浏览器</text>
    <line x1="160" y1="124" x2="220" y2="180" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="220" y="96" width="460" height="220" rx="16" fill="none" stroke="#3f6a58" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="240" y="124" font-size="13" fill="#3f6a58">一次部署 · 一个进程</text>
    <rect x="248" y="144" width="160" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="268" y="172" font-size="15" font-weight="600" fill="#2e3330">订单模块</text>
    <text x="268" y="194" font-size="13" fill="#5e6661">插入待支付</text>
    <line x1="408" y1="176" x2="468" y2="176" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="412" y="166" font-size="12" fill="#3f6a58">方法调用</text>
    <rect x="476" y="144" width="160" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="496" y="172" font-size="15" font-weight="600" fill="#2e3330">库存模块</text>
    <text x="496" y="194" font-size="13" fill="#5e6661">扣库存</text>
    <text x="248" y="248" font-size="14" fill="#2e3330">BEGIN → 扣库存 → 插入待支付 → COMMIT</text>
    <text x="248" y="276" font-size="13" fill="#5e6661">方法返回前结束。失败则两张表一起回滚。</text>

    <line x1="450" y1="316" x2="450" y2="360" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="320" y="368" width="260" height="56" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="360" y="402" font-size="15" font-weight="600" fill="#2e3330">一个数据库 · 一次提交</text>

    <rect x="720" y="144" width="200" height="72" rx="12" fill="#f6ecea" stroke="#a05048"/>
    <text x="740" y="174" font-size="15" font-weight="600" fill="#6e3530">支付页</text>
    <text x="740" y="198" font-size="13" fill="#6e3530">事务已经结束</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6a58"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6280"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6661"/>
    </marker>
  </defs>
</svg>
