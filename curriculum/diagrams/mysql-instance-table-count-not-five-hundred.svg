<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">表数量 500 是治理线</title>
  <desc id="desc">红线提醒复杂度，不定义物理上限。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 元数据</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">单实例表数 500 不是引擎天花板</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">误读</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">第 501 张必挂</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">多租户一表一户卡死</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">数字当真理</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">治理</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">归档合并</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">共享表+租户键</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">拆实例</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">红线提醒复杂度，不定义物理上限。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">改模型优于改数字</text>
  </g>
</svg>
