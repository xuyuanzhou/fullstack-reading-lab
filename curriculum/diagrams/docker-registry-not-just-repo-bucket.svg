<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Registry 与 Repository 不是同一个桶</title>
  <desc id="desc">拉镜像要写清主机、仓库名与 tag，不要只背仓储二字。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Docker / 仓库</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">仓储口诀要拆成 Registry 与 Repository</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料口吻</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">仓储放一堆镜像</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">Hub 当唯一答案</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">Registry/Repo 混称</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分层</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">Registry 是服务端点</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">Repository 是镜像名空间</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">tag 指向具体摘要</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">拉镜像要写清主机、仓库名与 tag，不要只背仓储二字。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照镜像/容器课</text>
  </g>
</svg>
