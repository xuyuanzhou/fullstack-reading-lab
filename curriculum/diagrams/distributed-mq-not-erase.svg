<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">消息解耦不消掉库存不变量</title>
  <desc id="desc">订单写入消息队列并返回成功，并不等于库存侧已经扣减成功。最终一致仍要靠 Outbox、幂等、补偿与对账。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">DISTRIBUTED</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">解耦的是调用时机，不是成功条件</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料里的捷径</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">订单落库 + 写队列 → 立刻返回成功</text>
    <text x="52" y="196" font-size="14" fill="#6e3530">库存挂了也「不影响下单」</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">成功订单数可以超过可售库存</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">实际还要补的</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">业务与事件同事务（Outbox）</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">消费幂等 + 失败补偿</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">对账把差额落到订单号</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">消息只推迟了库存侧的动作，没有删掉「卖出不能多于库存」。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 distributed-outbox、distributed-seckill、distributed-reconcile-last</text>
  </g>
</svg>
