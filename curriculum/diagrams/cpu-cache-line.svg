<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">伪共享发生在缓存行，不是字段</title>
  <desc id="desc">CPU 按约 64 字节的缓存行搬主存。相邻的 long a 和 long b 常在同一行。两个线程各写一个，整行仍会在核之间失效。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">CPU</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">没有锁，仍可能抢同一条缓存行</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="100" width="560" height="120" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="14" font-weight="600" fill="#6e3530">一条缓存行 · 常见 64 字节</text>
    <rect x="52" y="152" width="240" height="44" rx="8" fill="#fff"/>
    <text x="72" y="180" font-size="15" font-weight="600" fill="#2e3330">long a</text>
    <rect x="308" y="152" width="240" height="44" rx="8" fill="#fff"/>
    <text x="328" y="180" font-size="15" font-weight="600" fill="#2e3330">long b</text>
    <rect x="620" y="100" width="308" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="640" y="136" font-size="15" font-weight="600" fill="#2e3330">线程 A 写 a</text>
    <text x="640" y="166" font-size="15" font-weight="600" fill="#2e3330">线程 B 写 b</text>
    <text x="640" y="196" font-size="14" fill="#6e3530">整行在核之间失效</text>
    <rect x="32" y="244" width="896" height="112" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="280" font-size="15" font-weight="600" fill="#2e3330">这不是数据竞争，也不是把堆调大能修好的</text>
    <text x="52" y="312" font-size="14" fill="#3f6a58">隔开：字段之间加填充，或使用 Contended</text>
    <text x="52" y="336" font-size="14" fill="#5e6661">volatile 只保证可见性，不会把两个字段拆到两行</text>
  </g>
</svg>