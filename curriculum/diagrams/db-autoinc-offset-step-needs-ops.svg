<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">多主自增错位要运维契约</title>
  <desc id="desc">这是人工分段发号，不是数据库替你做的 Cluster。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">发号 / 自增</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">多 Master 起点+步长不是自动高可用</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料口吻</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">各主不同起点同步长</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">即可集群唯一</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">顺便解决单点</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">落地代价</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">参数要全局协调</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">扩缩主数要改步长</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">仍有空洞与切换</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">这是人工分段发号，不是数据库替你做的 Cluster。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照 sequence 批量与 Redis 发号课</text>
  </g>
</svg>
