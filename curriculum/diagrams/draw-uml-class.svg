<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">UML 类图：订单</title>
  <desc id="desc">实心菱形在订单一端，表示组合。用户与订单是带多重性的关联。空心三角指向支付方式。下单应用用虚线依赖库存端口。</desc>
  <rect width="960" height="580" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 类图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">实心菱形在整体一端，空心三角指向父类</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="36" y="112" width="148" height="96" fill="#fafaf8" stroke="#2e3330"/>
    <line x1="36" y1="144" x2="184" y2="144" stroke="#2e3330"/>
    <line x1="36" y1="176" x2="184" y2="176" stroke="#2e3330"/>
    <text x="110" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">用户</text>
    <text x="48" y="166" font-size="13" fill="#5e6661">userId</text>

    <rect x="300" y="100" width="168" height="120" fill="#e6efe9" stroke="#3f6a58"/>
    <line x1="300" y1="132" x2="468" y2="132" stroke="#3f6a58"/>
    <line x1="300" y1="184" x2="468" y2="184" stroke="#3f6a58"/>
    <text x="384" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单</text>
    <text x="312" y="154" font-size="13" fill="#5e6661">orderId</text>
    <text x="312" y="174" font-size="13" fill="#5e6661">status</text>
    <text x="312" y="206" font-size="13" fill="#2e3330">取消()</text>

    <rect x="628" y="108" width="168" height="64" fill="#fafaf8" stroke="#2e3330"/>
    <text x="712" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">支付方式</text>
    <rect x="548" y="248" width="140" height="48" fill="#fafaf8" stroke="#2e3330"/>
    <text x="618" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">在线支付</text>
    <rect x="760" y="248" width="150" height="48" fill="#fafaf8" stroke="#2e3330"/>
    <text x="835" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">货到付款</text>

    <rect x="300" y="328" width="168" height="72" fill="#e6efe9" stroke="#3f6a58"/>
    <line x1="300" y1="360" x2="468" y2="360" stroke="#3f6a58"/>
    <text x="384" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单行</text>
    <text x="312" y="382" font-size="13" fill="#5e6661">qty</text>
    <rect x="640" y="324" width="148" height="72" fill="#fafaf8" stroke="#2e3330"/>
    <line x1="640" y1="356" x2="788" y2="356" stroke="#2e3330"/>
    <text x="714" y="348" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">商品</text>
    <text x="652" y="380" font-size="13" fill="#5e6661">skuId</text>

    <rect x="36" y="448" width="160" height="52" rx="8" fill="#eef2f8" stroke="#4a6280"/>
    <text x="116" y="480" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">下单应用</text>
    <rect x="292" y="448" width="160" height="52" rx="8" fill="#eef2f8" stroke="#4a6280"/>
    <text x="372" y="480" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">库存端口</text>

    <line x1="184" y1="156" x2="300" y2="156" stroke="#2e3330" stroke-width="1.6"/>
    <text x="198" y="148" font-size="13" fill="#3f6a58">1</text>
    <text x="240" y="148" font-size="13" fill="#3f6a58">0..*</text>
    <line x1="468" y1="140" x2="628" y2="140" stroke="#2e3330" stroke-width="1.6"/>
    <text x="484" y="132" font-size="13" fill="#3f6a58">1</text>
    <text x="560" y="132" font-size="13" fill="#3f6a58">0..1</text>
    <line x1="618" y1="248" x2="680" y2="184" stroke="#2e3330" stroke-width="1.6" marker-end="url(#hollow)"/>
    <line x1="835" y1="248" x2="760" y2="184" stroke="#2e3330" stroke-width="1.6" marker-end="url(#hollow)"/>
    <polygon points="384,220 396,232 384,244 372,232" fill="#2e3330"/>
    <line x1="384" y1="244" x2="384" y2="328" stroke="#2e3330" stroke-width="1.6"/>
    <text x="402" y="270" font-size="13" fill="#3f6a58">1</text>
    <text x="402" y="318" font-size="13" fill="#3f6a58">1..*</text>
    <line x1="468" y1="360" x2="640" y2="360" stroke="#2e3330" stroke-width="1.6"/>
    <text x="520" y="352" font-size="13" fill="#3f6a58">0..*</text>
    <text x="604" y="352" font-size="13" fill="#3f6a58">1</text>
    <line x1="196" y1="474" x2="284" y2="474" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#open)"/>
    <text x="214" y="466" font-size="13" fill="#4a6280">依赖</text>

    <rect x="32" y="516" width="896" height="48" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="546" font-size="14" fill="#2e3330">用户和订单不要画空心菱形。多重性写在靠着那一端的位置。</text>
  </g>
  <defs>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fafaf8" stroke="#2e3330" stroke-width="1"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a6280" stroke-width="1.4"/>
    </marker>
  </defs>
</svg>
