<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">支付到签收分次提交</title>
  <desc id="desc">支付成功、扣减、出库、签收各自提交。签收只改订单库。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="#f6f7f4"/>
  <text x="32" y="34" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">支付成功之后，直到签收完成</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">每一步先提交，消息服务只投递已经提交的事实</text>

  <text x="32" y="88" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58">1 支付成功</text>
  <rect x="32" y="100" width="280" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="48" y="126" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">支付库 · 一次提交</text>
  <text x="48" y="146" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">支付行 + 待发记录</text>
  <line x1="312" y1="132" x2="360" y2="132" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="368" y="100" width="200" height="64" rx="12" fill="#eef3f6" stroke="#3d5c73"/>
  <text x="384" y="126" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">消息服务</text>
  <text x="384" y="146" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3d5c73">只投递已提交记录</text>

  <text x="32" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58">2 两个消费方，各提交一次</text>
  <rect x="32" y="208" width="280" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="48" y="234" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单库</text>
  <text x="48" y="254" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">待支付 → 已支付</text>
  <rect x="340" y="208" width="280" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="356" y="234" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">锁定库</text>
  <text x="356" y="254" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">预留 → 已扣减</text>

  <text x="32" y="304" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58">3 出库</text>
  <rect x="32" y="316" width="300" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="48" y="342" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">履约库 · 一次提交</text>
  <text x="48" y="362" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">发货单 + 已出库待发</text>
  <line x1="332" y1="348" x2="380" y2="348" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="388" y="316" width="280" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="404" y="342" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单库 · 另一次提交</text>
  <text x="404" y="362" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">已支付 → 已发货</text>

  <text x="32" y="412" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58">4 签收</text>
  <rect x="32" y="424" width="300" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="48" y="450" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单库 · 一次提交</text>
  <text x="48" y="470" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#3f6a58">已发货 → 已完成</text>
  <rect x="360" y="424" width="360" height="64" rx="12" fill="#f3f1ea" stroke="#8a928c"/>
  <text x="376" y="450" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">支付库、锁定库不再写</text>
  <text x="376" y="470" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">数量在扣减时已经定下来</text>

  <rect x="32" y="504" width="896" height="40" rx="10" fill="#f6ecea" stroke="#a05048"/>
  <text x="48" y="529" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">支付失败：释放预留，订单改为已取消。这一支不进入已发货。</text>
</svg>
