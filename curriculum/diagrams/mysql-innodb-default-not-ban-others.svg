<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">InnoDB 是默认不是清零</title>
  <desc id="desc">与官方默认一致，不等于引擎清单只剩一个。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 引擎</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">必须 InnoDB＝业务默认选型</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">过度读</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">其它引擎非法</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">背引擎名</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略遗留迁移</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">稳妥读</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">默认 InnoDB</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">要事务就选它</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">例外要论证</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">与官方默认一致，不等于引擎清单只剩一个。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见引擎对比课</text>
  </g>
</svg>
