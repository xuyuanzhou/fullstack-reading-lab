<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">SAVE 堵住命令，BGSAVE 另起子进程</title>
  <desc id="desc">SAVE 在调用线程里写完整个快照，期间不处理别的命令。BGSAVE 用子进程写时拷贝，父进程继续服务。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">REDIS</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">快照两种做法，卡住的是不是主进程</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="168" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">SAVE</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">在服务线程里写完 dump.rdb</text>
    <text x="52" y="196" font-size="14" fill="#6e3530">这段时间不接别的命令</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">适合停机窗口，不适合高峰</text>
    <rect x="496" y="96" width="432" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">BGSAVE</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">fork 子进程写快照</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">父进程继续处理命令</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">配置里的 save 规则走这条</text>
    <rect x="32" y="288" width="896" height="80" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="320" font-size="15" font-weight="600" fill="#2e3330">fork 瞬间仍可能有短停顿；写时拷贝会占额外内存。</text>
    <text x="52" y="348" font-size="14" fill="#5e6661">AOF 与 RDB 能否并存见 redis-aof-keeps-rdb</text>
  </g>
</svg>
