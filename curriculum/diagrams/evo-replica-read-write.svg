<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">写和刚支付走主库</title>
  <desc id="desc">列表和详情可以走从库，延迟期内状态可以不同。</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker></defs>
  <rect width="960" height="280" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">写和刚支付走主库</text>
  
  <rect x="32" y="80" width="200" height="56" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="48" y="108" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">应用</text>
  <line x1="232" y1="100" x2="300" y2="80" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="310" y="56" width="220" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="326" y="84" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">主库 · 写 / 刚支付</text>
  <line x1="232" y1="120" x2="300" y2="180" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="232" y1="120" x2="300" y2="180" stroke="#3f6a58" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <rect x="310" y="160" width="240" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="326" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">从库 · 列表 / 详情</text>
  <line x1="420" y1="104" x2="420" y2="160" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="440" y="140" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">二进制日志</text>
  <rect x="600" y="120" width="320" height="64" rx="12" fill="#f6ecea" stroke="#a05048"/><text x="616" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">延迟期内</text><text x="616" y="170" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">两边状态可以不同</text>

</svg>
