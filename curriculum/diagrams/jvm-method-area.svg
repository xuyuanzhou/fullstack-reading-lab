<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">方法区、永久代、Metaspace 是三套名字</title>
  <desc id="desc">方法区是规范概念。永久代是旧的 HotSpot 实现。JDK 8 起类元数据在 Metaspace。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">方法区、永久代、Metaspace 是三套名字</text>
  <rect x="32" y="88" width="280" height="150" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#3f6a58" text-anchor="start">规范名</text><text x="48" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">方法区</text><text x="48" y="190" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">线程共享，存放类结构</text><text x="48" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">不规定必须叫永久代</text><rect x="340" y="88" width="280" height="150" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="356" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5e6661" text-anchor="start">旧实现名</text><text x="356" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#8a918c" text-anchor="start">永久代</text><text x="356" y="190" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">HotSpot 曾经用它实现</text><text x="356" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">JDK 8 起不再有这块</text><rect x="648" y="88" width="280" height="150" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="664" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#3f6a58" text-anchor="start">现行实现名</text><text x="664" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">Metaspace</text><text x="664" y="190" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">类元数据在本地内存</text><text x="664" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">上限看 MaxMetaspaceSize</text><rect x="32" y="256" width="432" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="286" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2e3330" text-anchor="start">日志写 Metaspace</text><text x="48" y="310" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">查类元数据，不要去找 PermSize</text><rect x="496" y="256" width="432" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="512" y="286" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2e3330" text-anchor="start">日志写 Java heap space</text><text x="512" y="310" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">查堆里的对象，不是方法区三个字</text><rect x="32" y="344" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="372" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">调参和报错跟实现名走。规范里的“方法区”不会出现在 OOM 文案里。</text>
</svg>
