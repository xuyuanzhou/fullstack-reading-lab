<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">鸦脚 ER 图：订单</title>
  <desc id="desc">实体是方框。靠近订单的鸦脚表示一个用户有零条或多条订单，双竖线表示一条订单恰好属于一个用户。</desc>
  <rect width="960" height="440" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">ER 图 · 鸦脚记法</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">记号画在靠着那个实体的一端</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="36" y="96" width="150" height="88" rx="10" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="111" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">用户</text>
    <text x="111" y="156" text-anchor="middle" font-size="12" fill="#5e6661">user_id</text>
    <line x1="186" y1="140" x2="328" y2="140" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="214" y1="128" x2="214" y2="152" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="222" y1="128" x2="222" y2="152" stroke="#2e3330" stroke-width="1.6"/>
    <circle cx="292" cy="140" r="6" fill="none" stroke="#2e3330"/>
    <path d="M304 140 L328 124 L328 156 Z" fill="none" stroke="#2e3330" stroke-width="1.6"/>
    <rect x="336" y="96" width="160" height="88" rx="10" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="416" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单</text>
    <text x="416" y="156" text-anchor="middle" font-size="12" fill="#5e6661">order_id, user_id</text>
    <line x1="496" y1="140" x2="628" y2="140" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="524" y1="128" x2="524" y2="152" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="532" y1="128" x2="532" y2="152" stroke="#2e3330" stroke-width="1.6"/>
    <circle cx="592" cy="140" r="6" fill="none" stroke="#2e3330"/>
    <path d="M604 140 L628 124 L628 156 Z" fill="none" stroke="#2e3330" stroke-width="1.6"/>
    <rect x="636" y="96" width="180" height="88" rx="10" fill="#eef2f8" stroke="#4a6280"/>
    <text x="726" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单行</text>
    <text x="726" y="156" text-anchor="middle" font-size="12" fill="#5e6661">order_id, sku_id, qty</text>
    <line x1="726" y1="184" x2="726" y2="248" stroke="#2e3330" stroke-width="1.6"/>
    <circle cx="726" cy="220" r="6" fill="none" stroke="#2e3330"/>
    <path d="M726 232 L710 256 L742 256 Z" fill="none" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="710" y1="276" x2="742" y2="276" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="710" y1="284" x2="742" y2="284" stroke="#2e3330" stroke-width="1.6"/>
    <rect x="636" y="300" width="180" height="72" rx="10" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="726" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">商品</text>
    <text x="726" y="352" text-anchor="middle" font-size="12" fill="#5e6661">sku_id</text>
    <text x="36" y="400" font-size="14" fill="#2e3330">|| 恰好 1　　o| 0 或 1　　|&lt; 1 或多　　o&lt; 0 或多。记号贴在这一端。</text>
  </g>
</svg>
