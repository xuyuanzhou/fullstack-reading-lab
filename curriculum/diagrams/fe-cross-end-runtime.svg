<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">一个产品面一个运行时</title>
  <desc id="desc">浏览器、小程序、原生不缝进同一个组件。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="380" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">选型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">一个产品面一个运行时</text>
  <rect x="32" y="88" width="288" height="168" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">浏览器</text><text x="48" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">画到 DOM</text><text x="48" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">用选定的 Web 框架</text><rect x="336" y="88" width="288" height="168" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="352" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">小程序</text><text x="352" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">uni-app 或 Taro</text><text x="352" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">只留一个</text><rect x="640" y="88" width="288" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="656" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">原生界面</text><text x="656" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">React Native</text><text x="656" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">没有 DOM</text><rect x="32" y="280" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="308" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">uni-app x 是另一套工程，不把旧的 Vue 页面混进去。</text>
</svg>
