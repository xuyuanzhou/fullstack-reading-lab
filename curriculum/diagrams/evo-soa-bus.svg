<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">调用方只连总线，两个服务仍共库</title>
  <desc id="desc">没有一个进程内事务能盖住两次提交。</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">调用方只连总线，两个服务仍共库</text>
  
  <rect x="32" y="64" width="140" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="48" y="92" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">调用方 A</text>
  <rect x="32" y="120" width="140" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="48" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">调用方 B</text>
  <rect x="32" y="176" width="140" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="48" y="204" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">调用方 C</text>
  <line x1="172" y1="84" x2="250" y2="140" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="172" y1="140" x2="250" y2="150" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="172" y1="196" x2="250" y2="160" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="260" y="120" width="160" height="56" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="276" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">企业服务总线</text>
  <line x1="420" y1="136" x2="500" y2="90" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="420" y1="156" x2="500" y2="190" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="510" y="64" width="160" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="526" y="92" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单服务</text>
  <rect x="510" y="170" width="160" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="526" y="198" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">库存服务</text>
  <line x1="590" y1="112" x2="700" y2="150" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="590" y1="170" x2="700" y2="170" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="700" y="130" width="220" height="56" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="716" y="158" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">同一个库</text>
  <text x="32" y="260" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">没有一个进程内事务能盖住这两次提交</text>

</svg>
