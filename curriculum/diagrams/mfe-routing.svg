<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">一条历史栈与 basename</title>
  <desc id="desc">壳拥有顶层前缀，子应用只处理自己的一段路径。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">路由</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">浏览器只有一条历史栈</text>
  <rect x="32" y="88" width="896" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="52" y="128" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41">壳的顶层路由：/   /orders/*   /goods/*     ← 一条 history</text>
  <rect x="32" y="176" width="430" height="140" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/>
  <text x="52" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330">订单子应用</text>
  <text x="52" y="246" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">basename = /orders</text>
  <text x="52" y="274" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">内部：/list、/detail/:id</text>
  <text x="52" y="302" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5a635e">对外仍是 /orders/list</text>
  <rect x="498" y="176" width="430" height="140" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/>
  <text x="518" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330">不要这样做</text>
  <text x="518" y="246" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">子应用再造顶层 BrowserRouter</text>
  <text x="518" y="274" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">两边抢 popstate / pushState</text>
  <text x="518" y="302" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5a635e">返回键错乱、刷新易 404</text>
  <rect x="32" y="338" width="896" height="40" rx="12" fill="#e6efe9"/>
  <text x="52" y="364" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41">服务器要把子前缀回退到壳的 index.html，再由壳挂载子应用。</text>
</svg>
