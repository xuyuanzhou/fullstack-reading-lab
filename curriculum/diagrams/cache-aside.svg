<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">旁路缓存（Cache Aside）：缓存站在数据库旁边</title>
  <desc id="desc">旁路指缓存不挡在写路径中间。应用负责两边：读未命中回填，写成功后删键。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">旁路缓存 · 主流 Redis</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">缓存站在数据库旁边，由应用管两边</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="188" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/>
    <text x="52" y="132" font-size="16" font-weight="600" fill="#2e3330">读</text>
    <text x="52" y="168" font-size="14" fill="#5e6661">1. 先查缓存，命中就返回</text>
    <text x="52" y="196" font-size="14" fill="#5e6661">2. 没有就查数据库</text>
    <text x="52" y="224" font-size="14" fill="#3f6a58">3. 把结果放进缓存（回填）</text>
    <text x="52" y="252" font-size="14" fill="#3f6a58">权威仍在数据库</text>
    <rect x="498" y="96" width="430" height="188" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/>
    <text x="518" y="132" font-size="16" font-weight="600" fill="#2e3330">写</text>
    <text x="518" y="168" font-size="14" fill="#5e6661">1. 先改数据库</text>
    <text x="518" y="196" font-size="14" fill="#3f6a58">2. 成功后再删除缓存键</text>
    <text x="518" y="224" font-size="14" fill="#5e6661">3. 下一次读重新回填</text>
    <text x="518" y="252" font-size="14" fill="#6e3530">不要在写路径顺手写入新值</text>
  </g>
  <text x="32" y="332" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">主流 Redis；另有 Memcached；进程内一级常用 Caffeine（不能跨实例）。</text>
  <text x="32" y="358" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">应用做 GET / SET 回填 / DEL。旁路：缓存不挡在写路径中间。</text>
</svg>
