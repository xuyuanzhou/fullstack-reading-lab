<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">手机号长度不是魔法 20</title>
  <desc id="desc">不做数学运算对；必须 20 不必。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 字段</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">别用数字类型，也别把长度钉死 20</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">规范钉死</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">必须 varchar(20)</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略分机与 E.164</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">长度当校验</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开看</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">不用数值类型</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">长度按形态留余量</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">规范化后再唯一</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">不做数学运算对；必须 20 不必。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">校验在应用与约束</text>
  </g>
</svg>
