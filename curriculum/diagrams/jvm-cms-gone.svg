<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">服务器默认是 G1，CMS 已经不能再打开</title>
  <desc id="desc">JDK 9 起服务器模式默认 G1。CMS 在 JDK 14 移除。PermSize 也不再是现行参数。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">服务器默认是 G1，CMS 已经不能再打开</text>
  <rect x="32" y="88" width="288" height="180" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58" text-anchor="start">JDK 9 起</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">默认 G1</text><text x="48" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">服务器模式</text><text x="48" y="224" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">UseG1GC 通常已是默认</text><rect x="340" y="88" width="288" height="180" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="356" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#a05048" text-anchor="start">JDK 14 起</text><text x="356" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#6e3530" text-anchor="start">CMS 已删除</text><text x="356" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">UseConcMarkSweepGC</text><text x="356" y="224" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">在 JDK 21 上启动失败</text><rect x="648" y="88" width="280" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="664" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5e6661" text-anchor="start">更短停顿</text><text x="664" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#2e3330" text-anchor="start">先测量</text><text x="664" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">暂停对得上延迟</text><text x="664" y="218" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">再评估 ZGC</text><text x="664" y="240" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">不要贴 Java 7 清单</text><rect x="32" y="292" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="320" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">MaxPermSize 同样无效。类元数据看 MaxMetaspaceSize。</text>
</svg>
