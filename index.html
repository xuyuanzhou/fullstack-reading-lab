<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>全栈学习实验室 · 学习、验证、复盘</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menuToggle" class="icon-button mobile-only" aria-label="打开课程目录">☰</button>
    <div class="brand"><span class="brand-mark">{ }</span><span>全栈学习实验室<small>FULLSTACK LEARNING LAB</small></span></div>
    <nav class="topnav" aria-label="主导航">
      <button id="homeTab">学习路线</button>
      <button id="libraryTab">知识库</button>
      <button id="auditTab">知识核验</button>
      <button id="savedTab">复习清单</button>
    </nav>
    <div class="top-actions"><span id="count" class="top-count"></span><button id="themeToggle" class="icon-button" aria-label="切换深浅色">◐</button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head"><span class="eyebrow">LEARNING PATH / 学习路径</span><button class="icon-button mobile-only" id="closeMenu" aria-label="关闭目录">×</button></div>
      <div class="track-switch" role="group" aria-label="学习方向"><button data-track="frontend" class="selected">前端工程</button><button data-track="java">Java 后端</button></div>
      <div id="roadmap"></div>
      <div class="sidebar-foot"><p class="eyebrow">REACT SOURCE</p><strong>深入 React 运行时</strong><p>相关课程直达 React Mastery Lab 的 v19.3.0 源码。</p><a href="https://xuyuanzhou.github.io/react-mastery-lab/" target="_blank" rel="noopener">打开 React 源码实验室 ↗</a></div>
    </aside>
    <main id="mainPanel" class="main-panel" tabindex="-1"></main>
    <aside class="inspector"><div id="rightPanel"></div><div class="privacy-note"><span class="eyebrow">OPEN LEARNING</span><strong>公开课程，独立核验</strong><p>知识卡与练习为原创内容。购买资料和 PDF 密码不会进入网站。学习记录只存在当前浏览器。</p></div></aside>
  </div>
  <script src="lessons.js"></script>
  <script src="extra-lessons.js"></script>
  <script src="distributed-lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
