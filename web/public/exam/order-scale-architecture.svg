<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">高并发下单架构</title>
  <desc id="desc">请求经限流进入无状态下单服务。库存条件更新与订单、发件箱在同一个数据库事务里同步完成。列表可读允许滞后的从库或缓存。通知与履约异步投递。</desc>
  <rect width="1080" height="1080" rx="18" fill="#f6f7f4"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3f6a58"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a6280"/>
    </marker>
  </defs>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <text x="36" y="40" font-size="12" font-weight="600" letter-spacing="1.4" fill="#3f6a58">笔试 OS-W1 / OS-W2 / OS-W6</text>
    <text x="36" y="74" font-size="22" font-weight="600" fill="#2e3330">同步守库存，异步做副作用，读可以旧几秒</text>

    <rect x="340" y="104" width="400" height="96" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="540" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">客户端</text>
    <text x="540" y="166" text-anchor="middle" font-size="14" fill="#5e6661">一百万 = 注册用户，不是同时在线</text>
    <text x="540" y="186" text-anchor="middle" font-size="13" fill="#3f6a58">10 万先写成每秒请求，或同时在途</text>

    <line x1="540" y1="200" x2="540" y2="236" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="180" y="244" width="720" height="112" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="204" y="276" font-size="16" font-weight="600" fill="#2e3330">接入 · 限流</text>
    <text x="204" y="304" font-size="14" fill="#2e3330">平日峰值记为 P。大促是 50P，不是注册用户的 50 倍。</text>
    <text x="204" y="328" font-size="14" fill="#2e3330">超过 50P：排队则用户看见等待，拒绝则看见失败。</text>
    <text x="204" y="350" font-size="13" fill="#5e6661">静态页不进下单库。下单过热时，查询也降速。</text>

    <line x1="540" y1="356" x2="540" y2="392" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="250" y="400" width="580" height="80" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="540" y="434" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">无状态下单服务</text>
    <text x="540" y="458" text-anchor="middle" font-size="14" fill="#5e6661">按峰值 50P 加副本。副本不加在同一行库存上。</text>

    <line x1="540" y1="480" x2="540" y2="512" stroke="#3f6a58" stroke-width="1.8"/>
    <line x1="286" y1="512" x2="794" y2="512" stroke="#3f6a58" stroke-width="1.8"/>
    <line x1="286" y1="512" x2="286" y2="548" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="794" y1="512" x2="794" y2="548" stroke="#4a6280" stroke-width="1.8" marker-end="url(#arr-b)"/>
    <text x="300" y="504" font-size="13" font-weight="600" fill="#3f6a58">同步 · 当场知道</text>
    <text x="620" y="504" font-size="13" font-weight="600" fill="#4a6280">读 · 允许旧 N 秒</text>

    <rect x="36" y="556" width="500" height="196" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="56" y="588" font-size="16" font-weight="600" fill="#2e3330">主库 · 同一事务</text>
    <text x="56" y="616" font-size="14" fill="#2e3330">幂等键唯一约束，冲突则返回第一笔</text>
    <text x="56" y="640" font-size="14" fill="#2e3330">UPDATE stock … WHERE n &gt;= 1</text>
    <text x="56" y="664" font-size="14" fill="#3f6a58">影响行数是 1，才写入订单和 Outbox</text>
    <text x="56" y="688" font-size="14" fill="#2e3330">这次请求返回成功、失败或等待</text>
    <text x="56" y="716" font-size="13" fill="#5e6661">同一 SKU 先排队。库按削峰后的速率写。</text>
    <text x="56" y="736" font-size="13" fill="#5e6661">不把 50P 同步打到一行。</text>

    <rect x="556" y="556" width="488" height="196" rx="14" fill="#eef2f8" stroke="#4a6280"/>
    <text x="576" y="588" font-size="16" font-weight="600" fill="#2e3330">从库或缓存</text>
    <text x="576" y="616" font-size="14" fill="#2e3330">只给列表和详情</text>
    <text x="576" y="640" font-size="14" fill="#2e3330">图上写明允许旧 N 秒</text>
    <text x="576" y="664" font-size="14" fill="#2e3330">刚写下的订单读主库</text>
    <text x="576" y="688" font-size="14" fill="#2e3330">或界面写明仍在处理</text>
    <text x="576" y="720" font-size="13" fill="#4a6280">这里的库存数不能决定能不能卖</text>

    <line x1="286" y1="752" x2="286" y2="788" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="36" y="796" width="300" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="56" y="832" font-size="16" font-weight="600" fill="#2e3330">Outbox</text>
    <text x="56" y="860" font-size="14" fill="#2e3330">与订单行同一个事务</text>
    <text x="56" y="884" font-size="13" fill="#5e6661">一起提交，或一起回滚</text>

    <line x1="336" y1="856" x2="372" y2="856" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="380" y="796" width="240" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="400" y="832" font-size="16" font-weight="600" fill="#2e3330">消息</text>
    <text x="400" y="860" font-size="14" fill="#2e3330">至少一次投递</text>
    <text x="400" y="884" font-size="13" fill="#5e6661">最老一条年龄 ≤ N 秒</text>

    <line x1="620" y1="856" x2="656" y2="856" stroke="#3f6a58" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="664" y="796" width="380" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="684" y="832" font-size="16" font-weight="600" fill="#2e3330">通知 · 检索 · 履约</text>
    <text x="684" y="860" font-size="14" fill="#2e3330">消费者按业务键幂等</text>
    <text x="684" y="884" font-size="13" fill="#5e6661">重复投递不留下第二次副作用</text>

    <rect x="36" y="940" width="1008" height="100" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="56" y="976" font-size="15" font-weight="600" fill="#6e3530">不合格</text>
    <text x="56" y="1004" font-size="14" fill="#6e3530">只画一排微服务。用缓存扣减当库存权威。用五千万行直接拆库。</text>
    <text x="56" y="1028" font-size="14" fill="#6e3530">把库存扣减改成只发消息，等消费者再扣。</text>
  </g>
</svg>
