<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">代理取模不是 Redis Cluster</title>
  <desc id="desc">Twemproxy 一类代理按哈希取模把键分到多台独立 Redis。官方 Cluster 用 16384 槽和客户端重定向，不是代理替你取模。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">REDIS</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">前面加一层代理，不等于开了官方集群</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="168" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">代理 + 哈希取模</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">Twemproxy / Codis 一类</text>
    <text x="52" y="196" font-size="14" fill="#5e6661">多台独立 Redis，键靠取模落点</text>
    <text x="52" y="228" font-size="14" fill="#6e3530">客户端常只看见代理</text>
    <rect x="496" y="96" width="432" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">Redis Cluster</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">16384 槽 · 节点互知</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">MOVED / ASK 重定向</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">redis-cli --cluster 运维</text>
    <rect x="32" y="288" width="896" height="80" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="320" font-size="15" font-weight="600" fill="#2e3330">增减节点时，取模几乎整表搬家；槽迁移只动受影响的键。</text>
    <text x="52" y="348" font-size="14" fill="#5e6661">哨兵做主从切换，也不分片，见 redis-sentinel-cluster</text>
  </g>
</svg>
