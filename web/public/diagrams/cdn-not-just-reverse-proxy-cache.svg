<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">CDN 与反向代理不是同一种缓存</title>
  <desc id="desc">资料把 CDN 和反向代理都说成缓存。CDN 在边缘就近；反向代理在源站侧，常做 TLS、负载均衡与路由，缓存只是可选能力。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">EDGE / ORIGIN</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">都可能缓存，但站位与职责不同</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">CDN</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">靠近用户的边缘节点</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">就近返回静态或可缓存响应</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">不替代源站鉴权与动态写</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e8eef6" stroke="#3f5a7a"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">反向代理</text>
    <text x="516" y="164" font-size="14" fill="#3f5a7a">部署在源站机房一侧</text>
    <text x="516" y="196" font-size="14" fill="#3f5a7a">TLS、选上游、限流、可缓存</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">见 mw-proxy-lb-gateway</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">一句“原理都是缓存”会漏掉边缘分布与源站入口两层问题。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">动态接口默认不要指望 CDN 当业务缓存</text>
  </g>
</svg>
