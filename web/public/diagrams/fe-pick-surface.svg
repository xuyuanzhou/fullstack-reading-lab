<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">先写这次交到哪一端</title>
  <desc id="desc">四个目标端可以是四个产品。同一页不承诺四种运行时。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">选型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">先写这次交到哪一端</text>
  <rect x="32" y="88" width="214" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">后台</text><text x="48" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">浏览器应用</text><text x="48" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">首屏可以是壳</text><rect x="262" y="88" width="214" height="180" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="278" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">文章</text><text x="278" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">源码里要有正文</text><text x="278" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">少量组件才跑脚本</text><rect x="492" y="88" width="214" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="508" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">微信</text><text x="508" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">单独的小程序</text><text x="508" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">要登记页面</text><rect x="722" y="88" width="206" height="180" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="738" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">已有 App</text><text x="738" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">React Native</text><text x="738" y="192" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">View 与列表</text><rect x="32" y="292" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="320" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">热度不是目标端。空着的格这次不做。</text>
</svg>
