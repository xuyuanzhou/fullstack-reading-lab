<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
 <title id="title">布隆过滤器的位数组查询</title><desc id="desc">元素经过多个哈希函数映射到位数组。任一位为零表示确定不存在；全部为一表示可能存在。</desc>
 <rect width="900" height="340" rx="18" fill="#f1f5f9"/><text x="38" y="48" font-family="sans-serif" font-size="21" font-weight="700" fill="#102a43">位数组保存的是集合线索，不是元素本身</text>
 <rect x="45" y="93" width="160" height="66" rx="10" fill="#fff" stroke="#94a3b8"/><text x="75" y="133" font-family="sans-serif" font-size="18" fill="#1e293b">查询元素 X</text>
 <path d="M205 126 H276" stroke="#475569" stroke-width="3"/><path d="M276 126 l-10 -6 v12 z" fill="#475569"/>
 <rect x="278" y="82" width="156" height="89" rx="10" fill="#e0e7ff"/><text x="304" y="118" font-family="sans-serif" font-size="16" fill="#26368a">h₁(X) → 2</text><text x="304" y="148" font-family="sans-serif" font-size="16" fill="#26368a">h₂(X) → 6</text>
 <g font-family="sans-serif" font-size="17" text-anchor="middle"><text x="102" y="221" fill="#475569">索引</text><text x="102" y="265" fill="#475569">位值</text></g>
 <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#475569"><text x="199" y="220">0</text><text x="287" y="220">1</text><text x="375" y="220">2</text><text x="463" y="220">3</text><text x="551" y="220">4</text><text x="639" y="220">5</text><text x="727" y="220">6</text><text x="815" y="220">7</text></g>
 <g font-family="sans-serif" font-size="20" text-anchor="middle"><rect x="159" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="199" y="267" fill="#334155">0</text><rect x="247" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="287" y="267" fill="#334155">1</text><rect x="335" y="235" width="80" height="49" rx="6" fill="#dbeafe"/><text x="375" y="267" fill="#1d4ed8">1</text><rect x="423" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="463" y="267" fill="#334155">0</text><rect x="511" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="551" y="267" fill="#334155">1</text><rect x="599" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="639" y="267" fill="#334155">0</text><rect x="687" y="235" width="80" height="49" rx="6" fill="#dbeafe"/><text x="727" y="267" fill="#1d4ed8">1</text><rect x="775" y="235" width="80" height="49" rx="6" fill="#fff"/><text x="815" y="267" fill="#334155">0</text></g>
 <text x="354" y="318" font-family="sans-serif" font-size="15" fill="#1d4ed8">2 和 6 都是 1 → 可能存在，仍需查权威数据</text>
</svg>
