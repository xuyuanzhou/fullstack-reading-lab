<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">禁浮点存货币，不要禁 DECIMAL</title>
  <desc id="desc">规范写禁止小数存货币。应禁 FLOAT/DOUBLE；DECIMAL 或整数分才是金额类型。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / MONEY</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">“小数”要拆开浮点与定点</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">误读禁令</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">禁止一切小数</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">连 DECIMAL 也打回</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">有人改去用 FLOAT</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">正确对象</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">禁 FLOAT / DOUBLE</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">用 DECIMAL 或整数分</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">定点才能对账</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">钱对不上来自二进制浮点，不是 DECIMAL(p,s)。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 mysql-float-ieee-not-8-digits</text>
  </g>
</svg>
