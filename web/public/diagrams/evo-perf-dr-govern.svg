  <rect x="300" y="60" width="120" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="316" y="88" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">网关</text>
