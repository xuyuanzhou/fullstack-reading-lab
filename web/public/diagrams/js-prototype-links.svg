<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">方法在原型上，链的尽头是 null</title>
  <desc id="desc">两个实例各自有字段，方法在构造函数的 prototype 上只有一份。查找沿着 getPrototypeOf 走到 Object.prototype，再走到 null。</desc>
  <rect width="960" height="430" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JAVASCRIPT</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">class 把方法放在原型上，不是每个实例一份</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="200" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">实例 c1</text>
    <text x="52" y="160" font-size="14" fill="#5e6661">n = 0，在自己身上</text>
    <text x="52" y="186" font-size="14" fill="#3f6a58">没有 inc，往上找</text>
    <rect x="252" y="96" width="200" height="120" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="272" y="132" font-size="15" font-weight="600" fill="#2e3330">实例 c2</text>
    <text x="272" y="160" font-size="14" fill="#5e6661">n 是另一份</text>
    <text x="272" y="186" font-size="14" fill="#3f6a58">也去同一个原型</text>
    <path d="M132 216 V248" stroke="#3f6a58" stroke-width="2"/>
    <path d="M352 216 V248" stroke="#3f6a58" stroke-width="2"/>
    <path d="M132 248 H352" stroke="#3f6a58" stroke-width="2"/>
    <path d="M242 248 V268" stroke="#3f6a58" stroke-width="2"/>
    <polygon points="236,268 248,268 242,280" fill="#3f6a58"/>
    <rect x="148" y="288" width="390" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="168" y="322" font-size="15" font-weight="600" fill="#2e3330">Person.prototype</text>
    <text x="168" y="350" font-size="14" fill="#3f6a58">inc 只有一份，c1.inc === c2.inc</text>
    <rect x="560" y="288" width="368" height="88" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="580" y="322" font-size="15" font-weight="600" fill="#2e3330">Object.prototype</text>
    <text x="580" y="350" font-size="14" fill="#5e6661">toString 等，再上一层是 null</text>
  </g>
</svg>