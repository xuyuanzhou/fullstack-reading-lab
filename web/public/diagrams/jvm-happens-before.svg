<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">现行可见性看 happens-before</title>
  <desc id="desc">read、load、use、assign、store、write、lock、unlock 是 JDK 5 之前的旧模型，不是虚拟机必须执行的八条指令。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">现行可见性看 happens-before</text>
  <rect x="32" y="88" width="420" height="188" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5e6661" text-anchor="start">旧模型 · 不要再当现行规范</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#8a918c" text-anchor="start">read   load   use   assign</text><text x="48" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#8a918c" text-anchor="start">store  write  lock  unlock</text><text x="48" y="244" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">对汇编时找不到名叫 store 的字节码</text><rect x="492" y="88" width="436" height="188" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="508" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#3f6a58" text-anchor="start">JSR-133 之后</text><text x="508" y="164" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="start">volatile 写</text><text x="508" y="196" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#3f6a58" text-anchor="start">happens-before</text><text x="508" y="232" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330" text-anchor="start">之后对这个变量的读</text><rect x="32" y="300" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="328" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">跨线程要靠同步边。运行时数据区是另一张图，不要叠进这八个词。</text>
</svg>
