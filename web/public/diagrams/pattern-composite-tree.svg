<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">对根调用一次，不用先问是不是叶子</title>
  <desc id="desc">叶子和容器是同一接口。容器把调用转给子节点再汇总。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">结构型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">对根调用一次，不用先问是不是叶子</text>
  <rect x="360" y="88" width="240" height="72" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="480" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="middle">套装.price</text><rect x="80" y="200" width="220" height="88" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="190" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="middle">单品</text><rect x="370" y="200" width="220" height="88" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="480" y="240" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="middle">内层套装</text><text x="480" y="266" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#3f6a58" text-anchor="middle">再汇总子节点</text><rect x="660" y="200" width="220" height="88" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="770" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="middle">单品</text><rect x="32" y="316" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="344" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">调用方不写 instanceof。只包一个对象并加行为，那是装饰器。</text>
</svg>
