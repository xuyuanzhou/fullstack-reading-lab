<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">容量 LRU 不等于 TTL 过期</title>
  <desc id="desc">标题写带过期时间的 LRU，正文常只做满容量删链表尾。TTL 到点失效是另一维。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">CACHE / LRU</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">标题有过期，正文不能只画链表</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">只做容量维</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">HashMap + 双向链表</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">满了删尾 = LRU</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">未满则键可永驻</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">过期维还要</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">节点带 deadline</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">get / 扫时删过期</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">与容量淘汰并行</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">O(1) get/set 只证明容量 LRU；TTL 要单独设计。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 distributed-cache、redis-eviction-policy-menu</text>
  </g>
</svg>
