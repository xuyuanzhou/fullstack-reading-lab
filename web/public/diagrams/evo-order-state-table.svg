<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">订单状态只沿箭头迁移</title>
  <desc id="desc">七个状态。没有箭头的一对不能转换。已取消、已退款、已退货没有离开的箭头。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="34" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">允许的迁移才画箭头</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#5e6661">订单行只存当前状态。更新条件写箭头的起点</text>

  <circle cx="36" cy="118" r="7" fill="#2e3330"/>
  <line x1="43" y1="118" x2="56" y2="118" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="56" y="94" width="140" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="90" y="123" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">待支付</text>
  <rect x="292" y="94" width="140" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="326" y="123" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">已支付</text>
  <rect x="528" y="94" width="140" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="562" y="123" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">已发货</text>
  <rect x="764" y="94" width="140" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="798" y="123" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#2e3330">已完成</text>

  <line x1="196" y1="118" x2="292" y2="118" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="208" y="110" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">支付成功</text>
  <line x1="432" y1="118" x2="528" y2="118" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="456" y="110" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">出库</text>
  <line x1="668" y1="118" x2="764" y2="118" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="692" y="110" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">签收</text>

  <rect x="56" y="248" width="140" height="48" rx="12" fill="#f6ecea" stroke="#a05048"/>
  <text x="90" y="277" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#6e3530">已取消</text>
  <rect x="292" y="248" width="140" height="48" rx="12" fill="#f6ecea" stroke="#a05048"/>
  <text x="326" y="277" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#6e3530">已退款</text>
  <rect x="528" y="248" width="376" height="48" rx="12" fill="#f6ecea" stroke="#a05048"/>
  <text x="680" y="277" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" fill="#6e3530">已退货</text>

  <line x1="126" y1="142" x2="126" y2="248" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="134" y="198" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">取消</text>
  <line x1="362" y1="142" x2="362" y2="248" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="370" y="198" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">退款完成</text>
  <line x1="598" y1="142" x2="598" y2="248" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="606" y="198" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">退货入库</text>
  <line x1="834" y1="142" x2="834" y2="248" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="842" y="198" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">顾客退回</text>

  <text x="32" y="340" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" fill="#6e3530">已取消、已退款、已退货没有向外的箭头。已支付不到已取消。已发货不用退款完成。已完成不用退货入库。</text>
</svg>
