<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">VM 与容器是权衡</title>
  <desc id="desc">按威胁模型选。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">运行 / 隔离</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">不是新旧替罪羊</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">站队</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">容器淘汰 VM</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">或 VM 才安全绝对</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略密度</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">权衡</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">密度/速度</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">强隔离</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">微 VM 中间态</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">按威胁模型选。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">节点可以是 VM</text>
  </g>
</svg>
