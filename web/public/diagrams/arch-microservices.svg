<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">微服务按业务能力拆</title>
  <desc id="desc">订单、库存、支付各自独立部署并拥有自己的数据。当场结果同步预留，副作用异步并补偿。按控制器、服务、数据访问三层拆开，不是微服务。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="460" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">系统设计</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">拆的是业务能力，不是技术分层</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="92" width="896" height="72" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="122" font-size="14" font-weight="600" fill="#6e3530">按层切开不是边界</text>
    <text x="52" y="146" font-size="14" fill="#6e3530">Controller 仓库、Service 仓库、Dao 仓库：一次下单要三次发布，表仍然共享。</text>
    <rect x="32" y="186" width="250" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/>
    <text x="52" y="222" font-size="16" font-weight="600" fill="#2e3330">订单服务</text>
    <text x="52" y="252" font-size="14" fill="#5e6661">只写订单库</text>
    <text x="52" y="280" font-size="14" fill="#3f6a58">独立部署</text>
    <text x="52" y="306" font-size="14" fill="#3f6a58">独立扩缩</text>
    <rect x="355" y="186" width="250" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/>
    <text x="375" y="222" font-size="16" font-weight="600" fill="#2e3330">库存服务</text>
    <text x="375" y="252" font-size="14" fill="#5e6661">只写库存库</text>
    <text x="375" y="280" font-size="14" fill="#3f6a58">同步预留要超时</text>
    <text x="375" y="306" font-size="14" fill="#3f6a58">重复调用要幂等</text>
    <rect x="678" y="186" width="250" height="168" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/>
    <text x="698" y="222" font-size="16" font-weight="600" fill="#2e3330">支付服务</text>
    <text x="698" y="252" font-size="14" fill="#5e6661">只写支付库</text>
    <text x="698" y="280" font-size="14" fill="#3f6a58">失败走补偿</text>
    <text x="698" y="306" font-size="14" fill="#3f6a58">不共享本地事务</text>
  </g>
  <text x="32" y="400" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">当场要结果：同步预留库存（超时 + 幂等）。副作用：异步履约；失败走补偿。</text>
  <text x="32" y="426" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#5e6661">不能 join 对方的库。要数据就走 API 或只读副本，并接受延迟。</text>
</svg>