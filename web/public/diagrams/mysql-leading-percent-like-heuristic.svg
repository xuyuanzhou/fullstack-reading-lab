<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">前导百分号与最左前缀</title>
  <desc id="desc">规范应推动正确访问路径，而不是禁字符。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / LIKE</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">% 在前难用 B+ 最左，不是禁百分号</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">易混</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">有 % 就扫表</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">禁掉 a% 前缀搜</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">尾缀仍硬 LIKE</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">%a 难最左</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">a% 常可范围</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">尾缀用倒排/冗余</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">规范应推动正确访问路径，而不是禁字符。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">EXPLAIN 对照</text>
  </g>
</svg>
