<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">UML 状态图：订单</title>
  <desc id="desc">实心圆是初始伪状态。圆角矩形是状态。箭头上是触发迁移的事件。取消只从待支付出发。</desc>
  <rect width="960" height="360" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 状态机图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">箭头上写事件，没有箭头就不允许这次迁移</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <circle cx="64" cy="168" r="10" fill="#2e3330"/>
    <line x1="74" y1="168" x2="118" y2="168" stroke="#2e3330" stroke-width="1.6" marker-end="url(#st)"/>
    <rect x="118" y="136" width="140" height="64" rx="18" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="188" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">待支付</text>
    <line x1="258" y1="168" x2="330" y2="168" stroke="#2e3330" stroke-width="1.6" marker-end="url(#st)"/>
    <text x="268" y="156" font-size="13" fill="#3f6a58">支付成功</text>
    <rect x="330" y="136" width="140" height="64" rx="18" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="400" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">已支付</text>
    <line x1="470" y1="168" x2="542" y2="168" stroke="#2e3330" stroke-width="1.6" marker-end="url(#st)"/>
    <text x="486" y="156" font-size="13" fill="#3f6a58">出库</text>
    <rect x="542" y="136" width="140" height="64" rx="18" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="612" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">已发货</text>
    <line x1="682" y1="168" x2="754" y2="168" stroke="#2e3330" stroke-width="1.6" marker-end="url(#st)"/>
    <text x="692" y="156" font-size="13" fill="#3f6a58">签收</text>
    <rect x="754" y="136" width="160" height="64" rx="18" fill="#eef2f8" stroke="#4a6280"/>
    <text x="834" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">已完成</text>
    <path d="M188 200 C188 270 188 270 188 292" fill="none" stroke="#a05048" stroke-width="1.6" marker-end="url(#stRed)"/>
    <text x="200" y="250" font-size="13" fill="#6e3530">取消</text>
    <rect x="118" y="292" width="140" height="48" rx="16" fill="#f6ecea" stroke="#a05048"/>
    <text x="188" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#6e3530">已取消</text>
  </g>
  <defs>
    <marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e3330"/>
    </marker>
    <marker id="stRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a05048"/>
    </marker>
  </defs>
</svg>
