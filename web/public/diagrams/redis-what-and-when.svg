<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Redis is an in-memory data structure service</title>
  <desc id="desc">Cache and hot state, not a substitute relational ledger.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Redis / intro</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">In-memory data structures, not a substitute ledger</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">What it is</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">String Hash List Set ZSet Stream</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">atomic commands in memory</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">optional persistence and replication</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#6e3530">Not this</text>
    <text x="516" y="164" font-size="14" fill="#2e3330">sole ACID order ledger</text>
    <text x="516" y="196" font-size="14" fill="#2e3330">drop-in SQL replacement</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">unlimited durable store</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Typical: hot cache, ranks/counters, short queues or locks. Keep ledgers in the DB.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See redis-data-types and cache-aside-steps</text>
  </g>
</svg>
