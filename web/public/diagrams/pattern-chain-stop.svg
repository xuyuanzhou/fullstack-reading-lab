<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">不调用下一个，后面就不运行</title>
  <desc id="desc">链上的一环可以选择停。每一环都无条件往后传，目标动作仍会发生。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">请求</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">不调用下一个，后面就不运行</text>
  <rect x="32" y="88" width="280" height="188" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">日志</text><text x="48" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">记下请求</text><text x="48" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">调用下一个</text><text x="48" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">请求继续</text><rect x="340" y="88" width="280" height="188" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="356" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">认证</text><text x="356" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">没有身份</text><text x="356" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">不调用下一个</text><text x="356" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">写 401</text><rect x="648" y="88" width="280" height="188" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="664" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">控制器</text><text x="664" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">这条路径不到</text><text x="664" y="194" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">业务方法无日志</text><text x="664" y="220" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#2e3330" text-anchor="start">停在上一环</text><rect x="32" y="300" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="328" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">能停的那一环在拒绝时不把请求交出去。</text>
</svg>
