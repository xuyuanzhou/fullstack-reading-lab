<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">UTF8 别名不是 utf8mb4</title>
  <desc id="desc">“万国码”口号要落到 utf8mb4，不要停在三字节别名。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 字符集</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">规范里的 UTF8 要对齐 utf8mb4</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">含糊写法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">必须使用 UTF8</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">utf8 常是 utf8mb3</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">emoji 易踩坑</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">对齐写法</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">显式 utf8mb4</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">连接串一并指定</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">迁移先查非法码点</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">“万国码”口号要落到 utf8mb4，不要停在三字节别名。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见字符集与行大小课</text>
  </g>
</svg>
