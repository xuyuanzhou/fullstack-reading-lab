<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">C4 容器图：下单</title>
  <desc id="desc">人、容器和带标签的箭头。同步箭头写明同一事务里的不变量，异步箭头写明消息。</desc>
  <rect width="960" height="480" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">C4 容器图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">方框是能单独部署的一块，箭头写清这一次交换什么</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="390" y="88" width="180" height="56" rx="28" fill="#fafaf8" stroke="#2e3330"/>
    <text x="480" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">下单用户</text>
    <line x1="480" y1="144" x2="480" y2="176" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="492" y="166" font-size="12" fill="#3f6a58">HTTPS</text>
    <rect x="360" y="176" width="240" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="480" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单页面</text>
    <text x="480" y="224" text-anchor="middle" font-size="12" fill="#5e6661">容器 · 浏览器里的页面</text>
    <line x1="480" y1="240" x2="480" y2="272" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="492" y="262" font-size="12" fill="#3f6a58">HTTPS · 提交订单</text>
    <rect x="360" y="272" width="240" height="64" rx="12" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="480" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">订单服务</text>
    <text x="480" y="320" text-anchor="middle" font-size="12" fill="#5e6661">容器 · 可独立部署的进程</text>
    <line x1="360" y1="304" x2="188" y2="304" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="196" y="292" font-size="12" fill="#3f6a58">SQL · 同一事务</text>
    <rect x="32" y="272" width="156" height="64" rx="12" fill="#eef2f8" stroke="#4a6280"/>
    <text x="110" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">MySQL</text>
    <text x="110" y="320" text-anchor="middle" font-size="12" fill="#5e6661">扣库存并插入订单</text>
    <line x1="600" y1="304" x2="772" y2="304" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
    <text x="620" y="292" font-size="12" fill="#4a6280">异步 · 订单已创建</text>
    <rect x="772" y="272" width="156" height="64" rx="12" fill="#fafaf8" stroke="#4a6280"/>
    <text x="850" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">消息</text>
    <text x="850" y="320" text-anchor="middle" font-size="12" fill="#5e6661">发货稍后消费</text>
    <rect x="32" y="380" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="408" font-size="14" fill="#2e3330">实线：调用方还在等，不变量在这一次事务里成立。</text>
    <text x="52" y="432" font-size="14" fill="#2e3330">虚线：事实已经成立，副作用稍后发生。箭头上没有协议和数据，这个框就不要画。</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6a58"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6280"/>
    </marker>
  </defs>
</svg>
