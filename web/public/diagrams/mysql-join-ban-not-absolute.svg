<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">禁止 JOIN 不是 SQL 真理</title>
  <desc id="desc">规范常写禁止 JOIN 因会产生临时表。有索引的联结可以很便宜；应用层 N+1 更贵。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / JOIN</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">禁的是坏计划，不是 JOIN 关键字</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">绝对禁令</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">代码里不准出现 JOIN</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">理由：一定临时表</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">容易逼出 N+1</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">按计划决策</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">有索引的小结果联结 OK</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">EXPLAIN 看 type / rows</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">无索引大表对撞才危险</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">“计算上移”是容量启发式，要用证据，不要禁用关键字。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 MySQL JOIN / EXPLAIN 文档</text>
  </g>
</svg>
