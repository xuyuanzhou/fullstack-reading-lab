<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">唯一插入加定时清表不是租约</title>
  <desc id="desc">互斥可演示；cron 清表缺服务端过期与 fencing。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">分布式锁</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">唯一插入 + cron 清表 ≠ 租约</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料口吻</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">INSERT 成功 = 持锁</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">定时任务扫超时行</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">while 重插补阻塞</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">落地缺口</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">清理有延迟与误删</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">缺 fencing token</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">忙等打爆连接池</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">互斥可演示；租约要服务端过期语义与持有者令牌。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照 Redis SET NX PX 与 FOR UPDATE 课</text>
  </g>
</svg>
