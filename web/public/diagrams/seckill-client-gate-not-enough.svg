<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">客户端门闩挡不住会改请求的人</title>
  <desc id="desc">资料承认 JS 禁用按钮只能防普通人。开抢时间、资格与库存必须以服务端校验为准，不能信任客户端带来的开始标记。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SECKILL</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">按钮灰了，不等于接口关了</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">只做客户端</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">Disable 下单按钮</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">JS 里藏开始时间与 URL</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">改包、直打 API 仍可通过</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">服务端必须做</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">校验活动是否已开始</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">限流、资格、原子扣库存</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">见 distributed-seckill</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">客户端优化减噪音；权威规则在接口与库存扣减。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">资料第 52 页也写了不能信任客户端</text>
  </g>
</svg>
