<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">禁止外键不是完整性过时</title>
  <desc id="desc">性能与完整性要同时有策略，不能只剩口号。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 约束</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">外键禁令是启发式，完整性仍要有主</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">规范语气</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">禁止外键</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">应用保证即可</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略绕过路径</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开决策</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">单库可保留 FK</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">热点可去掉+对账</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">跨服务本就无 FK</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">性能与完整性要同时有策略，不能只剩口号。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">与冗余计数字段课对照</text>
  </g>
</svg>
