<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">列数 30 是审查线</title>
  <desc id="desc">列类型与投影比列数更伤。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 建模</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">单表列&lt;30 管的是宽表味道</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">误读</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">30 是行格式定律</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">逼出碎片表</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">忽略 SELECT *</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">正经治</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">垂直拆分</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">疏稀进侧表/JSON</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">热点列清单</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">列类型与投影比列数更伤。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照行大小课</text>
  </g>
</svg>
