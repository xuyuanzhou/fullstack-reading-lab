<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">漏桶不是天生无临界</title>
  <desc id="desc">漏桶约束出水速率；满桶仍会溢出或排队。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">限流</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">漏桶整形出口，并不消灭临界问题</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料口吻</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">固定窗口有临界突发</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">漏桶天生无临界</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">还能保证常速处理</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">落地</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">限制的是出水速率</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">满桶溢出或排队</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">突发与速率要两维选</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">整形 ≠ 消灭边界问题；令牌桶允许短突发是另一选型。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照 distributed-token-bucket</text>
  </g>
</svg>
