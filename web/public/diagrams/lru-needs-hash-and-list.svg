<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">LRU 要两结构</title>
  <desc id="desc">对照容量非 TTL 课。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">缓存 / 淘汰</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">哈希+链表，容量≠TTL</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">残缺</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">只有链表</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">把 TTL 当 LRU</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">说不清 O(1)</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">完整</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">哈希定位</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">链表次序</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">容量满淘汰</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">对照容量非 TTL 课。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">手写验证</text>
  </g>
</svg>
