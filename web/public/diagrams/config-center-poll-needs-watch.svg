<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">配置中心不要靠定时盲轮询</title>
  <desc id="desc">读多写少时固定间隔拉取多半空跑；变更通知或长轮询驱动拉取，本地缓存带版本与兜底。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">CONFIG CENTER</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">盲轮询会先打满配置集群</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">只轮询</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">每 N 秒拉全量 / 全键</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">多数请求版本未变</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">实例一多就空跑加压</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">推拉结合</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">变更通知 / 长轮询 / watch</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">再拉该 dataId</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">本地缓存：版本 + 兜底对账</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">资料后半的 MQ/ZK 通知才是方向；分钟级“自动生效”是窗口。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 sca-nacos-config</text>
  </g>
</svg>
