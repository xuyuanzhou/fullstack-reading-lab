<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">晋升阈值最大是 15，16 不是参数</title>
  <desc id="desc">年龄只有 4 位。阈值若一直是 15，第 15 次活下来年龄变成 15，下一次年轻代回收才晋升。Survivor 超过目标时当前阈值会降下来。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="450" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">晋升阈值最大是 15，16 不是参数</text>
  <rect x="32" y="84" width="896" height="150" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="114" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="start">MaxTenuringThreshold 一直是 15</text><rect x="48" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="71" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">0</text><rect x="102" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="125" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">1</text><rect x="156" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="179" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">2</text><rect x="210" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="233" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">3</text><rect x="264" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="287" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">4</text><rect x="318" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="341" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">5</text><rect x="372" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="395" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">6</text><rect x="426" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="449" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">7</text><rect x="480" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="503" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">8</text><rect x="534" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="557" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">9</text><rect x="588" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="611" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">10</text><rect x="642" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="665" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">11</text><rect x="696" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="719" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">12</text><rect x="750" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="773" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">13</text><rect x="804" y="132" width="46" height="46" rx="8" fill="#fafaf8" stroke="#d9ddd8"/><text x="827" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2e3330" text-anchor="middle">14</text><rect x="858" y="132" width="46" height="46" rx="8" fill="#3f6a58" stroke="#3f6a58"/><text x="881" y="161" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#fafaf8" text-anchor="middle">15</text><text x="48" y="206" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#5e6661" text-anchor="start">年龄先被加到 15。下一次回收开始时年龄已经达到阈值，这次才进老年代。</text><rect x="32" y="250" width="430" height="110" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="48" y="282" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">不能写成 16</text><text x="48" y="310" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">16 是把两次回收数在一起</text><text x="48" y="332" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">PrintFlagsFinal 里是 15</text><rect x="486" y="250" width="442" height="110" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="502" y="282" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">当前阈值可以降到 3</text><text x="502" y="310" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">Survivor 体积超过目标</text><text x="502" y="332" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">年龄 ≥ 3 的对象这次就晋升</text><rect x="32" y="378" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="406" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">日志里看 new threshold。它小于 15 时，不要再等年龄走到 15。</text>
</svg>
