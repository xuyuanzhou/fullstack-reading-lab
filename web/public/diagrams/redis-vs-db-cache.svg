<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">DB is authoritative; Redis cache can lag</title>
  <desc id="desc">Cache Aside allows brief inconsistency between DB and Redis.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Redis / vs DB</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Authoritative DB; cache may briefly disagree</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">Database</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">transactions and ledger</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">source of truth</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">write path of record</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#eef2f8" stroke="#4a6280"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">Redis cache</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">hot reads, lower latency</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">Cache Aside invalidate</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">brief stale is possible</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Money and stock stay in the DB. Cache speeds rebuildable projections.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See cache-aside-steps and cache-db-double-write-race</text>
  </g>
</svg>
