  <rect x="32" y="100" width="140" height="56" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="48" y="128" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">浏览器</text>
