<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">三个服务各有一个库</title>
  <desc id="desc">预留是实线，支付成功后的消息是虚线。</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3f6a58"/></marker></defs>
  <rect width="960" height="300" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2e3330">三个服务各有一个库</text>
  
  <rect x="48" y="64" width="160" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="64" y="92" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单服务</text>
  <rect x="360" y="64" width="160" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="376" y="92" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">库存服务</text>
  <rect x="680" y="64" width="160" height="48" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="696" y="92" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">支付服务</text>
  <rect x="48" y="150" width="160" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="64" y="178" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">订单库</text>
  <rect x="360" y="150" width="160" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="376" y="178" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">库存库</text>
  <rect x="680" y="150" width="160" height="40" rx="12" fill="#e6efe9" stroke="#3f6a58"/><text x="696" y="178" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">支付库</text>
  <line x1="128" y1="112" x2="128" y2="150" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="440" y1="112" x2="440" y2="150" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="760" y1="112" x2="760" y2="150" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="208" y1="88" x2="360" y2="88" stroke="#3f6a58" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="230" y="78" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#3f6a58">预留 · 当场要结果</text>
  <path d="M760 64 V48 H128 V64" fill="none" stroke="#5e6661" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="320" y="44" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="12" fill="#5e6661">支付成功 · 从支付到订单</text>
  <rect x="680" y="220" width="240" height="48" rx="12" fill="#f6ecea" stroke="#a05048"/><text x="696" y="248" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">人在支付旁等待</text><text x="696" y="270" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#6e3530">不在库锁里</text>

</svg>
