<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">索引个数 5 不是定律</title>
  <desc id="desc">规范写单表索引≤5、组合列≤5。应用 EXPLAIN 与选择性决策，数字 5 只是启发式。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / INDEX</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">用计划说话，不要数到 5</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">硬指标</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">单表索引 ≤ 5</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">组合列 ≤ 5</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">第 6 条被一刀切</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">证据</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">EXPLAIN / 选择性</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">写放大可接受吗</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">最左前缀匹配吗</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">低区分度单独索引常废；宽组合错最左也废。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 MySQL 索引优化文档</text>
  </g>
</svg>
