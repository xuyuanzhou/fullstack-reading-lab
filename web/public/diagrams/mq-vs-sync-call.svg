<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Sync needs same-response results; messaging is after-the-fact</title>
  <desc id="desc">Pick sync or message from product premises, not brand names.</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Messaging / vs sync</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Same-response sync vs after-the-fact messaging</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#2e3330">Sync RPC / HTTP</text>
    <text x="52" y="164" font-size="14" fill="#3f6a58">need result in one response</text>
    <text x="52" y="196" font-size="14" fill="#3f6a58">immediate interactive errors</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">same-request boundary</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#eef2f8" stroke="#4a6280"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">Message channel</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">fact already committed</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">later processing OK</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">peak shave / fan-out</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">Premises first, product brand second. Idempotency still required on consume.</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">See mq-delivery-semantics and mq-consume-idempotent-key</text>
  </g>
</svg>
