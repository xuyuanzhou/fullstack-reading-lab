<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">先问独立发版再拆应用</title>
  <desc id="desc">同一小队同一次发版不必拆成多个前端应用。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">微前端</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">先问独立发版，再决定要不要拆</text>
  <rect x="32" y="88" width="280" height="210" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/>
  <text x="52" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41">谁拥有页面</text>
  <text x="52" y="158" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">菜单与路由前缀</text>
  <text x="52" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">有明确的团队主人</text>
  <text x="52" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">不是按目录深浅切</text>
  <rect x="340" y="88" width="280" height="210" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/>
  <text x="360" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330">谁能单独上线</text>
  <text x="360" y="158" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">不同发版窗口</text>
  <text x="360" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">可单独回滚</text>
  <text x="360" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">壳可以暂时不发</text>
  <rect x="648" y="88" width="280" height="210" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/>
  <text x="668" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330">失败用户看见什么</text>
  <text x="668" y="158" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">子模块降级文案</text>
  <text x="668" y="186" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">不要整站白屏</text>
  <text x="668" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">三句都指向同发版则不拆</text>
  <rect x="32" y="322" width="896" height="44" rx="12" fill="#e6efe9"/>
  <text x="52" y="350" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41">行数大可以先做包边界与懒加载；微前端买的是独立发布。</text>
</svg>
