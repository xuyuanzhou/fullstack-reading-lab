<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">四个职责位跟一种模型</title>
  <desc id="desc">同一张订单表不要从四套文档各抄一个库。</desc>
  <defs><filter id="soft" x="-6%" y="-8%" width="112%" height="124%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/></filter></defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">选型</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">四个职责位跟一种模型</text>
  <rect x="32" y="88" width="214" height="196" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">React</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Next / RR 框架</text><text x="48" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Query 或加载器</text><text x="48" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Toolkit 只放会话</text><rect x="262" y="88" width="214" height="196" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="278" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">Vue</text><text x="278" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Vite + Router</text><text x="278" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Pinia 跨页</text><text x="278" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">Nuxt 管首屏</text><rect x="492" y="88" width="214" height="196" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="508" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">Angular</text><text x="508" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">provideRouter</text><text x="508" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">HttpClient</text><text x="508" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">信号读结果</text><rect x="722" y="88" width="206" height="196" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="738" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">Svelte</text><text x="738" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">SvelteKit</text><text x="738" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">load 返回 data</text><text x="738" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">runes 不存列表</text><rect x="32" y="308" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="336" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">跨端运行时另算一笔，不跟 Web 框架缝进同一个组件。</text>
</svg>
