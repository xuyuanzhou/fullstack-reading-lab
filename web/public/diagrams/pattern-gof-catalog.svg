<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">二十三种先按三族列出</title>
  <desc id="desc">创建五个、结构七个、行为十一个。这一课只列名字，深入在后面的课。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">设计模式</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">二十三种先按三族列出</text>
  <rect x="32" y="88" width="288" height="232" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">创建 5</text><text x="48" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">工厂方法  抽象工厂</text><text x="48" y="184" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">建造者  原型</text><text x="48" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">单例</text><rect x="336" y="88" width="288" height="232" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="352" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">结构 7</text><text x="352" y="156" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">适配器  桥接  组合</text><text x="352" y="184" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">装饰器  外观</text><text x="352" y="212" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#2e3330" text-anchor="start">享元  代理</text><rect x="640" y="88" width="288" height="232" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="656" y="120" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">行为 11</text><text x="656" y="148" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#2e3330" text-anchor="start">责任链  命令  解释器</text><text x="656" y="174" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#2e3330" text-anchor="start">迭代器  中介者</text><text x="656" y="200" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#2e3330" text-anchor="start">备忘录  观察者</text><text x="656" y="226" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#2e3330" text-anchor="start">状态  策略</text><text x="656" y="252" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#2e3330" text-anchor="start">模板方法  访问者</text><rect x="32" y="340" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="368" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">写不出这三列时，不要先画某一个模式的类。</text>
</svg>
