<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">停顿先等线程到齐，再到回收</title>
  <desc id="desc">需要全局停顿时，Java 线程要到达安全点。长时间不调用方法的计数循环会拖住第一段。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">JVM</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">停顿先等线程到齐，再到回收</text>
  <rect x="32" y="88" width="210" height="72" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="137" y="130" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="middle">线程 1 已到</text><rect x="258" y="88" width="210" height="72" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="363" y="130" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="middle">线程 2 已到</text><rect x="484" y="88" width="210" height="72" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="589" y="130" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="middle">线程 3 已到</text><rect x="710" y="88" width="218" height="72" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="819" y="122" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#6e3530" text-anchor="middle">线程 4</text><text x="819" y="144" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#a05048" text-anchor="middle">还在纯计数</text><rect x="32" y="180" width="430" height="110" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="48" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2e3330" text-anchor="start">第一段 · 等到齐</text><text x="48" y="244" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">别人已经停下，空等这一条</text><text x="48" y="266" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">数数的循环拉长的是这段</text><rect x="486" y="180" width="442" height="110" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="502" y="214" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2d4f41" text-anchor="start">第二段 · 真正回收</text><text x="502" y="244" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">线程到齐之后才动堆</text><text x="502" y="266" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#5e6661" text-anchor="start">算法慢拉长的是这段</text><rect x="32" y="314" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="342" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">日志里把两段分开抄。不要把空等也写成回收器变慢。</text>
</svg>
