<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">倾斜有两种</title>
  <desc id="desc">先看炸的是分片还是键。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">架构 / 分片</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">虚拟节点管不了单键热点</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">混为一谈</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">不均=加虚节点</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">忽略秒杀键</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">哈希万能</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">分开治</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">节点分布</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">单键隔离</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">限流缓存</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">先看炸的是分片还是键。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照一致性哈希课</text>
  </g>
</svg>
