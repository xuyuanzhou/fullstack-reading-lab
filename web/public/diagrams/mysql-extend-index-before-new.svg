<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">扩展索引是维护策略</title>
  <desc id="desc">写放大与计划一起看。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / 索引</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">能扩展则扩展，无关则新建</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">极端</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">禁止新建</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">硬塞宽索引</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">或索引爆炸</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">平衡</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">共享前缀就扩展</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">无关路径新建</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">控总数</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">写放大与计划一起看。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">对照索引个数课</text>
  </g>
</svg>
