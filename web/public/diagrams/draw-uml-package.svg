<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">UML 包图：下单</title>
  <desc id="desc">虚线从下单应用指向订单，从订单指向商品和支付。没有从订单指回下单应用的箭头。</desc>
  <rect width="960" height="520" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 包图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">虚线从使用方指向被使用的包</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <line x1="250" y1="210" x2="360" y2="210" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#open)"/>
    <text x="262" y="198" font-size="13" fill="#4a6280">«import»</text>
    <line x1="580" y1="180" x2="680" y2="150" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#open)"/>
    <text x="590" y="156" font-size="13" fill="#4a6280">«import»</text>
    <line x1="580" y1="250" x2="680" y2="300" stroke="#4a6280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#open)"/>
    <text x="590" y="292" font-size="13" fill="#4a6280">«import»</text>

    <rect x="48" y="168" width="64" height="22" fill="#eef2f8" stroke="#4a6280"/>
    <rect x="48" y="188" width="202" height="100" fill="#eef2f8" stroke="#4a6280"/>
    <text x="149" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">下单应用</text>
    <text x="149" y="254" text-anchor="middle" font-size="13" fill="#5e6661">使用订单</text>

    <rect x="360" y="148" width="64" height="22" fill="#e6efe9" stroke="#3f6a58"/>
    <rect x="360" y="168" width="220" height="130" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="470" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">订单</text>
    <text x="470" y="242" text-anchor="middle" font-size="13" fill="#5e6661">订单</text>
    <text x="470" y="264" text-anchor="middle" font-size="13" fill="#5e6661">订单行</text>

    <rect x="680" y="96" width="56" height="20" fill="#fafaf8" stroke="#2e3330"/>
    <rect x="680" y="114" width="220" height="80" fill="#fafaf8" stroke="#2e3330"/>
    <text x="790" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">商品</text>
    <text x="790" y="172" text-anchor="middle" font-size="13" fill="#5e6661">商品</text>

    <rect x="680" y="292" width="56" height="20" fill="#fafaf8" stroke="#2e3330"/>
    <rect x="680" y="310" width="220" height="80" fill="#fafaf8" stroke="#2e3330"/>
    <text x="790" y="344" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3330">支付</text>
    <text x="790" y="368" text-anchor="middle" font-size="13" fill="#5e6661">支付方式</text>

    <rect x="32" y="440" width="896" height="60" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="466" font-size="14" fill="#2e3330">没有从订单指向下单应用的虚线。</text>
    <text x="52" y="486" font-size="14" fill="#2e3330">这一张不表示先写库还是先返回。先后用时序图。</text>
  </g>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a6280" stroke-width="1.4"/>
    </marker>
  </defs>
</svg>
