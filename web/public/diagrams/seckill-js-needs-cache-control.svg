<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">开抢标记 JS 也要显式禁止边缘缓存</title>
  <desc id="desc">资料说秒杀控制用的 JS 不会被 CDN 缓存。没有 Cache-Control、短 TTL 或独立小 URL，边缘仍可能缓存旧的「未开始」标记。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SECKILL / CDN</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">“一定不被缓存”要写进响应头</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">资料说法</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">控制 JS 不会被 CDN 缓存</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">一直打回源拿开始标记</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">只靠“文件很小”不够</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">要落地的</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">Cache-Control: no-store / 短 max-age</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">CDN 规则对该路径不缓存</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">开抢仍以服务端校验为准</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">静态大页可以上 CDN；开抢门闩不能靠口头“不被缓存”。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 cdn-not-just-reverse-proxy-cache、distributed-seckill</text>
  </g>
</svg>
