<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">读写必须打在代理上</title>
  <desc id="desc">改原始对象不会通知依赖。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3f6a58"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">Vue</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">读写必须打在代理上</text>
  <rect x="32" y="88" width="280" height="160" rx="14" fill="#f6ecea" stroke="#a05048" filter="url(#soft)"/><text x="48" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#6e3530" text-anchor="start">原始对象 raw</text><text x="48" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">raw.count++</text><text x="48" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">不经过代理</text><text x="48" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">依赖收不到</text><rect x="340" y="88" width="280" height="160" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="356" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">代理 state</text><text x="356" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">state.count++</text><text x="356" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">收集依赖 / 通知</text><text x="356" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">模板才更新</text><rect x="648" y="88" width="280" height="160" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="664" y="124" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">ref</text><text x="664" y="160" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">值在 .value</text><text x="664" y="188" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">模板自动解包</text><text x="664" y="216" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#2e3330" text-anchor="start">解构数字会断开</text><rect x="32" y="292" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="320" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">先看写入打在哪个对象上，再谈 Vue 有没有检测到变化。</text>
</svg>
