<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">ENUM 禁令是启发式</title>
  <desc id="desc">规范禁止 ENUM 改用 TINYINT。集合稳定可用 ENUM；常变要用字典。内部存整数不构成禁用理由。</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">SQL / ENUM</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">问集合会不会常变</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <rect x="32" y="96" width="430" height="176" rx="14" fill="#f6ecea" stroke="#a05048"/>
    <text x="52" y="132" font-size="15" font-weight="600" fill="#6e3530">绝对禁令</text>
    <text x="52" y="164" font-size="14" fill="#2e3330">一律改 TINYINT</text>
    <text x="52" y="196" font-size="14" fill="#2e3330">因为内部是整数</text>
    <text x="52" y="228" font-size="14" fill="#5e6661">易留下魔法数</text>
    <rect x="496" y="96" width="432" height="176" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="516" y="132" font-size="15" font-weight="600" fill="#2e3330">按变更频率</text>
    <text x="516" y="164" font-size="14" fill="#3f6a58">稳定小集合：ENUM OK</text>
    <text x="516" y="196" font-size="14" fill="#3f6a58">常变：码表 / 字典</text>
    <text x="516" y="228" font-size="14" fill="#5e6661">TINYINT 要有含义来源</text>
    <rect x="32" y="296" width="896" height="72" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="328" font-size="15" font-weight="600" fill="#2e3330">DDL 成本是真问题；“内部是整数”不是禁用理由。</text>
    <text x="52" y="352" font-size="14" fill="#5e6661">见 MySQL ENUM 手册</text>
  </g>
</svg>
