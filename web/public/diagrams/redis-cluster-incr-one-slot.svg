<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">同一个 INCR 键只在一台主上</title>
  <desc id="desc">Cluster 不拆五段步长</desc>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">REDIS</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">Cluster 不拆五段步长</text>
  <rect x="32" y="96" width="430" height="200" rx="14" fill="#f6ecea" stroke="#a05048"/>
  <text x="52" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#6e3530">资料里的做法</text>
  <text x="52" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">五节点初值 1..5</text>
<text x="52" y="200" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">步长都是 5</text>
<text x="52" y="232" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">连上集群就并行发号</text>
  <rect x="496" y="96" width="432" height="200" rx="14" fill="#e6efe9" stroke="#3f6a58"/>
  <text x="516" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2e3330">键实际落在哪</text>
  <text x="516" y="168" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">一个键一个槽</text>
<text x="516" y="200" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">槽在一台主上</text>
<text x="516" y="232" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" fill="#2e3330">切换后计数接着涨</text>
  <rect x="32" y="320" width="896" height="52" rx="12" fill="#e6efe9"/>
  <text x="52" y="352" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41">五段互不重叠的号，要五份钉死的计数器，不是一个 INCR 键。</text>
</svg>
