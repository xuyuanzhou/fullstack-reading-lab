<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">UML 对象图：这一刻的订单</title>
  <desc id="desc">u1 连接 o-1001。o-1001 连接 line-1 和 line-2。两个订单行各自只连接一个商品。</desc>
  <rect width="960" height="540" rx="18" fill="#f6f7f4"/>
  <text x="32" y="36" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">UML 对象图</text>
  <text x="32" y="64" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">下划线是这一刻的实例，不是类</text>
  <g font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif">
    <line x1="230" y1="150" x2="360" y2="150" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="470" y1="196" x2="250" y2="250" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="530" y1="196" x2="730" y2="250" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="200" y1="330" x2="200" y2="360" stroke="#2e3330" stroke-width="1.6"/>
    <line x1="760" y1="330" x2="760" y2="360" stroke="#2e3330" stroke-width="1.6"/>

    <rect x="48" y="112" width="182" height="76" fill="#fafaf8" stroke="#2e3330"/>
    <text x="139" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3330">u1 : 用户</text>
    <line x1="92" y1="148" x2="186" y2="148" stroke="#2e3330"/>
    <text x="139" y="170" text-anchor="middle" font-size="13" fill="#5e6661">userId = "u-9"</text>

    <rect x="360" y="112" width="240" height="84" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="480" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">o-1001 : 订单</text>
    <line x1="400" y1="150" x2="560" y2="150" stroke="#3f6a58"/>
    <text x="480" y="176" text-anchor="middle" font-size="13" fill="#5e6661">status = 待支付</text>

    <rect x="80" y="250" width="240" height="80" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="200" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">line-1 : 订单行</text>
    <line x1="130" y1="288" x2="270" y2="288" stroke="#3f6a58"/>
    <text x="200" y="312" text-anchor="middle" font-size="13" fill="#5e6661">qty = 2</text>

    <rect x="640" y="250" width="240" height="80" fill="#e6efe9" stroke="#3f6a58"/>
    <text x="760" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">line-2 : 订单行</text>
    <line x1="690" y1="288" x2="830" y2="288" stroke="#3f6a58"/>
    <text x="760" y="312" text-anchor="middle" font-size="13" fill="#5e6661">qty = 1</text>

    <rect x="110" y="360" width="180" height="64" fill="#fafaf8" stroke="#2e3330"/>
    <text x="200" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">sku-a : 商品</text>
    <line x1="140" y1="404" x2="260" y2="404" stroke="#2e3330"/>

    <rect x="670" y="360" width="180" height="64" fill="#fafaf8" stroke="#2e3330"/>
    <text x="760" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3330">sku-b : 商品</text>
    <line x1="700" y1="404" x2="820" y2="404" stroke="#2e3330"/>

    <rect x="32" y="456" width="896" height="64" rx="14" fill="#fafaf8" stroke="#d9ddd8"/>
    <text x="52" y="482" font-size="14" fill="#2e3330">两个订单行都只连着 o-1001。</text>
    <text x="52" y="504" font-size="14" fill="#2e3330">待支付是这一刻的属性值。允许怎样离开它，看状态图。</text>
  </g>
</svg>
