<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">共享的是不变部分</title>
  <desc id="desc">币种可以是同一份。金额由这一次调用传入，不能写进共享对象。</desc>
  <defs>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#28302a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f6f7f4"/>
  <text x="32" y="28" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#3f6a58">结构</text>
  <text x="32" y="56" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#2e3330">共享的是不变部分</text>
  <rect x="32" y="88" width="896" height="72" rx="14" fill="#eef0ec" stroke="#d9ddd8" filter="url(#soft)"/><text x="480" y="132" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="middle">币种 CNY：代码和符号，创建后不再改</text><rect x="32" y="184" width="430" height="100" rx="14" fill="#e6efe9" stroke="#3f6a58" filter="url(#soft)"/><text x="48" y="224" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2d4f41" text-anchor="start">明细甲</text><text x="48" y="256" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">金额由参数传入</text><rect x="498" y="184" width="430" height="100" rx="14" fill="#fafaf8" stroke="#d9ddd8" filter="url(#soft)"/><text x="514" y="224" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#2e3330" text-anchor="start">明细乙</text><text x="514" y="256" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#5e6661" text-anchor="start">币种是同一引用</text><rect x="32" y="312" width="896" height="44" rx="12" fill="#e6efe9"/><text x="48" y="340" font-family="'IBM Plex Sans','Noto Sans SC','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2d4f41" text-anchor="start">共享对象上出现会改字段的方法，这一份就不能再共享。</text>
</svg>
